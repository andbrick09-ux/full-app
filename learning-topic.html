<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080c14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Dom Sub Hub — Topic</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,1,0&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="nav.css"/>
<style>
  .topbar{display:flex;align-items:center;gap:12px}
  .back-btn{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(212,175,55,.08);border:1px solid var(--border);text-decoration:none;cursor:pointer}
  .back-btn:active{opacity:.7;transform:scale(.93)}
  .back-btn .material-symbols-rounded{font-size:20px;color:var(--gold)}
  .mastery-summary{text-align:center;padding:28px 20px;margin-bottom:24px}
  .mastery-pct{font-family:'Playfair Display',serif;font-size:44px;color:var(--gold);font-weight:700;line-height:1}
  .mastery-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#888;margin-top:6px}
  .sub-card{display:flex;align-items:center;gap:14px;padding:18px 20px;margin-bottom:14px;cursor:pointer}
  .sub-card:active{transform:scale(.98)}
  .sub-icon{width:42px;height:42px;border-radius:12px;background:rgba(212,175,55,.08);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sub-icon .material-symbols-rounded{color:var(--gold);font-size:20px}
  .sub-info{flex:1;min-width:0}
  .sub-title{font-family:'Playfair Display',serif;font-size:15px;color:#eee;margin-bottom:4px}
  .sub-meta{font-size:10px;color:#888}
  .sub-progress-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:8px}
  .sub-progress-fill{height:100%;background:var(--luxury-gradient);border-radius:3px}
  .sub-pct{font-size:13px;color:var(--gold);font-weight:700;flex-shrink:0}
  
  /* Modal Styles */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    z-index: 1000; display: none; align-items: center; justify-content: center;
    opacity: 0; transition: 0.3s;
  }
  .modal-overlay.open { display: flex; opacity: 1; }
  .modal-content {
    background: var(--surface); border: 1px solid var(--gold-b);
    border-radius: 20px; width: 90%; max-width: 500px; max-height: 85vh;
    display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
</style>
</head>
<body data-nav="Learning">

<div class="topbar">
  <a class="back-btn" href="learning-hub.html"><span class="material-symbols-rounded">arrow_back</span></a>
  <div class="topbar-center">
    <div class="topbar-title" id="topicTitle">Topic</div>
    <div class="topbar-sub">Learning</div>
  </div>
</div>

<div class="main">
  <div class="glass-card mastery-summary">
    <div class="mastery-pct" id="topicMastery">0%</div>
    <div class="mastery-label">Overall Mastery</div>
  </div>

  <div id="subList"></div>
</div>

<!-- Mastery Modal -->
<div class="modal-overlay" id="masteryModal">
  <div class="modal-content">
    <div style="padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-family:'Playfair Display',serif; color:var(--gold); margin:0; font-size:20px;">Mastery Tracker</h2>
      <span class="material-symbols-rounded" style="cursor:pointer; color:#888;" onclick="closeMasteryTracker()">close</span>
    </div>
    <div id="masteryContent" style="padding: 20px; overflow-y: auto; flex: 1;">
      <div style="text-align:center; color:#888; padding:40px;">Calculating Mastery...</div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { requireAuth } from './auth.js';
  import { collection, doc, getDoc, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { db } from './firebase-config.js';
  import { calculateSubcategoryMastery, calculateTopicMastery } from './training.js';

  const params = new URLSearchParams(window.location.search);
  const topicId = params.get('topic');
  let currentUser = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function init() {
    if (!topicId) { showToast('No topic specified.'); return; }
    currentUser = await requireAuth();

    const topicSnap = await getDoc(doc(db, 'trainingTopics', topicId));
    if (!topicSnap.exists()) { showToast('Topic not found.'); return; }
    const topic = topicSnap.data();
    document.getElementById('topicTitle').textContent = topic.title;

    const subsSnap = await getDocs(query(
      collection(db, 'trainingSubcategories'),
      where('topicId', '==', topicId),
      where('isActive', '==', true)
    ));
    const subs = subsSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

    const itemsSnap = await getDocs(query(collection(db, 'trainingItems'), where('topicId', '==', topicId), where('isActive', '==', true)));
    const allItems = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const progressSnap = await getDocs(query(
      collection(db, 'userTrainingProgress'),
      where('submissiveId', '==', currentUser.uid),
      where('topicId', '==', topicId)
    ));
    const progressByItemId = {};
    progressSnap.forEach(d => { progressByItemId[d.data().itemId] = d.data(); });

    // Topic-level mastery
    const allItemIds = allItems.map(i => i.id);
    document.getElementById('topicMastery').textContent = calculateTopicMastery(allItemIds, progressByItemId) + '%';

    const listEl = document.getElementById('subList');
    listEl.innerHTML = '';

    if (topicId === 'positions') {
      listEl.innerHTML += `
        <div class="glass-card sub-card" style="border-left: 3px solid var(--gold);" onclick="window.location.href='learning-article-positions.html'">
          <div class="sub-icon" style="color:var(--gold);"><span class="material-symbols-rounded">menu_book</span></div>
          <div class="sub-info">
            <div class="sub-title" style="color: var(--gold);">Official Learning Guide</div>
            <div class="sub-meta">Body Positions & Protocol Postures</div>
          </div>
          <div style="color:var(--gold);"><span class="material-symbols-rounded">chevron_right</span></div>
        </div>
        <div class="glass-card sub-card" style="border-left: 3px solid #4fc38a; background: rgba(79,195,138,0.05);" onclick="openMasteryTracker()">
          <div class="sub-icon" style="color:#4fc38a; border-color:#4fc38a;"><span class="material-symbols-rounded">military_tech</span></div>
          <div class="sub-info">
            <div class="sub-title" style="color: #4fc38a;">Position Mastery Tracker</div>
            <div class="sub-meta">Check your requirements for Gold Badges</div>
          </div>
          <div style="color:#4fc38a;"><span class="material-symbols-rounded">chevron_right</span></div>
        </div>
      `;
    }

    if (subs.length === 0) {
      listEl.innerHTML = `<div style="text-align:center;padding:40px;color:#777;">No subcategories yet.</div>`;
      return;
    }

    for (const sub of subs) {
      const subItemIds = allItems.filter(i => i.subcategoryId === sub.id).map(i => i.id);
      const pct = calculateSubcategoryMastery(subItemIds, progressByItemId);

      const card = document.createElement('div');
      card.className = 'glass-card sub-card';
      card.innerHTML = `
        <div class="sub-icon"><span class="material-symbols-rounded">category</span></div>
        <div class="sub-info">
          <div class="sub-title">${sub.title}</div>
          <div class="sub-meta">${subItemIds.length} item${subItemIds.length === 1 ? '' : 's'}</div>
          <div class="sub-progress-bar"><div class="sub-progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="sub-pct">${pct}%</div>
      `;
      card.onclick = () => {
        sessionStorage.removeItem('lm_queue');
        window.location.href = `learning-viewer.html?topic=${encodeURIComponent(topicId)}&sub=${encodeURIComponent(sub.id)}`;
      };
      listEl.appendChild(card);
    }
  }

  window.openMasteryTracker = async function() {
    document.getElementById('masteryModal').classList.add('open');
    document.getElementById('masteryContent').innerHTML = '<div style="text-align:center; color:#888; padding:40px;">Calculating Mastery...</div>';
    
    try {
      const actsSnap = await getDocs(query(
        collection(db, 'trainingActivity'),
        where('uid', '==', currentUser.uid),
        where('topicId', '==', 'positions')
      ));
      
      let readGuide = false;
      const holdsByPos = {}; 
      
      actsSnap.forEach(d => {
        const act = d.data();
        if (act.type === 'read_guide') readGuide = true;
        if (act.type === 'hold_practice' && act.title) {
          const posMatch = act.title.match(/Hold Practice:\s*(.*)/i);
          if (posMatch) {
            const pName = posMatch[1].trim();
            if (!holdsByPos[pName]) holdsByPos[pName] = { days: new Set(), photo: false, video: false };
            if (act.timestamp) {
               const dStr = act.timestamp.toDate().toDateString();
               holdsByPos[pName].days.add(dStr);
            }
            if (act.photoSent) holdsByPos[pName].photo = true;
            if (act.videoSent) holdsByPos[pName].video = true;
          }
        }
      });

      const topicMasteryPct = parseInt(document.getElementById('topicMastery').textContent) || 0;
      const quizPassed = topicMasteryPct >= 80;

      const positions = [
        "Attention", "Inspection", "Waitress", "Wall", "Oscar", "Wait",
        "Egyptian", "Collar Me", "Nadu", "Ready to Please",
        "Humble", "Table", "Stool", "Doll"
      ];

      let html = '';
      let totalMastered = 0;
      
      positions.forEach(p => {
        const data = holdsByPos[p] || { days: new Set(), photo: false, video: false };
        const holdCount = data.days.size;
        const isMastered = readGuide && quizPassed && holdCount >= 3 && data.photo && data.video;
        if (isMastered) totalMastered++;
        
        html += `
          <div class="glass-card" style="margin-bottom:12px; padding:16px; border-left:3px solid ${isMastered ? '#4fc38a' : 'rgba(255,255,255,0.1)'}; background: ${isMastered ? 'rgba(79,195,138,0.03)' : 'rgba(255,255,255,0.02)'}; border-radius:12px;">
            <div style="font-family:'Playfair Display',serif; font-size:18px; color:${isMastered ? '#4fc38a' : '#eee'}; margin-bottom:10px; display:flex; justify-content:space-between;">
              ${p} ${isMastered ? '<span class="material-symbols-rounded">military_tech</span>' : ''}
            </div>
            <div style="font-size:12px; color:#aaa; line-height:1.7;">
              <div><span style="color:${readGuide?'#4fc38a':'#666'};margin-right:6px;">${readGuide?'☑':'☐'}</span> Read Official Guide</div>
              <div><span style="color:${quizPassed?'#4fc38a':'#666'};margin-right:6px;">${quizPassed?'☑':'☐'}</span> Topic Knowledge > 80%</div>
              <div><span style="color:${holdCount>=3?'#4fc38a':'#666'};margin-right:6px;">${holdCount>=3?'☑':'☐'}</span> 3 Days of Hold Practice (${Math.min(holdCount,3)}/3)</div>
              <div><span style="color:${data.photo?'#4fc38a':'#666'};margin-right:6px;">${data.photo?'☑':'☐'}</span> Photo Proof Sent</div>
              <div><span style="color:${data.video?'#4fc38a':'#666'};margin-right:6px;">${data.video?'☑':'☐'}</span> Video Proof Sent</div>
            </div>
          </div>
        `;
      });

      document.getElementById('masteryContent').innerHTML = `
        <div style="text-align:center; margin-bottom:20px; font-family:'Playfair Display',serif; color:var(--gold);">
          ${totalMastered} / 14 Mastered
        </div>
        ${html}
      `;
    } catch (err) {
      console.error(err);
      document.getElementById('masteryContent').innerHTML = '<div style="color:var(--red); padding:20px;">Error calculating mastery.</div>';
    }
  };

  window.closeMasteryTracker = function() {
    document.getElementById('masteryModal').classList.remove('open');
  };

  init().catch(err => { console.error(err); showToast('Failed to load topic.'); });
</script>

<script src="nav.js"></script>
</body>
</html>
