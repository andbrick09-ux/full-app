<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080c14">
<title>Dom Sub Hub — Sub Roster</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
/* Page specific styles */
.roster-container {
  padding: env(safe-area-inset-top, 20px) 20px max(env(safe-area-inset-bottom, 80px), 80px);
  max-width: 600px;
  margin: 0 auto;
}

.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-top: 10px;
}
.header-bar h1 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: var(--gold-l);
  margin: 0;
}
.add-sub-btn {
  background: var(--surface);
  border: 1px solid var(--gold-b);
  color: var(--gold);
  border-radius: 50%;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
}
.add-sub-btn:hover { background: var(--gold-dim); border-color: var(--gold); }

.roster-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.sub-card {
  background: var(--surface);
  border: 1px solid var(--gold-b);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.2s;
}
.sub-card.active {
  border-color: var(--gold);
  box-shadow: 0 0 15px var(--gold-dim);
}
.sub-card:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
}

.sub-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sub-name {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: var(--text);
}
.sub-status {
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
}
.status-dot.active { background: var(--green); }
.status-dot.pending { background: var(--gold); }

.action-btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-family: 'Raleway', sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-select {
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  color: var(--gold-l);
}
.btn-select:hover { background: rgba(201,168,76,0.2); }
.btn-current {
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  pointer-events: none;
}
.btn-pending {
  background: transparent;
  border: 1px solid var(--muted);
  color: var(--muted);
  pointer-events: none;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  background: var(--surface);
  border-radius: 16px;
  border: 1px dashed var(--gold-b);
}
.empty-state p { color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
.empty-state a { color: var(--gold); text-decoration: none; font-weight: 600; }

.loading-spinner {
  text-align: center;
  padding: 40px;
  color: var(--gold);
  font-style: italic;
}
</style>
</head>
<body data-nav="more">

<div class="roster-container">
  <div class="header-bar">
    <h1>Sub Roster</h1>
    <a href="pair.html" class="add-sub-btn" title="Invite new Sub">
      <span class="material-symbols-rounded">person_add</span>
    </a>
  </div>

  <div id="loading" class="loading-spinner">Loading your roster...</div>
  <div id="rosterList" class="roster-list" style="display:none;"></div>
  
  <div id="emptyState" class="empty-state" style="display:none;">
    <p>You haven't linked any Subs to your profile yet.</p>
    <a href="pair.html">Invite your first Sub →</a>
  </div>
</div>

<script src="nav.js"></script>
<script type="module">
import { requireAuth, getMyProfile, getDomRoster, switchActiveSub, getUserProfile } from './auth.js';

async function init() {
  await requireAuth();
  const profile = await getMyProfile();
  
  if (profile.role !== 'dom') {
    document.querySelector('.roster-container').innerHTML = 
      '<div class="empty-state"><p>Only Doms can manage a roster.</p></div>';
    return;
  }

  const roster = await getDomRoster();
  const activeRelId = profile.activeRelationshipId;
  
  document.getElementById('loading').style.display = 'none';

  if (!roster || roster.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  const listEl = document.getElementById('rosterList');
  listEl.style.display = 'flex';
  
  let html = '';
  
  for (const rel of roster) {
    // Look up the sub's name
    const subProfile = await getUserProfile(rel.subId);
    const subName = subProfile?.name || subProfile?.username || 'Unknown Sub';
    const isActive = rel.id === activeRelId;
    const isPending = rel.status === 'pending';
    
    let btnHtml = '';
    if (isPending) {
      btnHtml = `<button class="action-btn btn-pending">Pending</button>`;
    } else if (isActive) {
      btnHtml = `<button class="action-btn btn-current">Current</button>`;
    } else {
      btnHtml = `<button class="action-btn btn-select" onclick="selectSub('${rel.id}')">Select</button>`;
    }
    
    html += `
      <div class="sub-card ${isActive ? 'active' : ''}">
        <div class="sub-info">
          <div class="sub-name">${subName}</div>
          <div class="sub-status">
            <div class="status-dot ${isPending ? 'pending' : (isActive ? 'active' : '')}"></div>
            ${isPending ? 'Invite Pending' : (isActive ? 'Active Focus' : 'Standby')}
          </div>
        </div>
        ${btnHtml}
      </div>
    `;
  }
  
  listEl.innerHTML = html;
}

window.selectSub = async function(relId) {
  try {
    // Show quick feedback
    event.target.textContent = 'Switching...';
    event.target.style.opacity = '0.5';
    
    await switchActiveSub(relId);
    
    // Reload the page to reflect the new active sub globally
    window.location.reload();
  } catch(e) {
    alert('Error switching sub: ' + e.message);
  }
};

init();
</script>
</body>
</html>
