<link rel="stylesheet" href="styles.css"/>

<style>
  html, body {
    overflow: hidden;

  }
  .topbar { display:flex; align-items:center; gap:12px; }
  .close-btn { width:36px; height:36px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:rgba(212,175,55,.08); border:1px solid var(--border); text-decoration:none; cursor:pointer; }
  .close-btn .material-symbols-rounded { font-size:20px; color:var(--gold); }

  .helper-text {
    text-align: center;
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 5px 0 15px 0;
  }
  .helper-text .material-symbols-rounded {
    font-size: 14px;
    vertical-align: middle;
    margin: 0 4px;
  }

  .carousel-container {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    height: calc(100vh - 150px);
  }
  .carousel-container::-webkit-scrollbar { display: none; }
  .carousel-container { -ms-overflow-style: none; scrollbar-width: none; }

  .carousel-slide {
    flex: 0 0 100%;
    scroll-snap-align: center;
    padding: 0 15px 80px 15px;
    box-sizing: border-box;
    overflow-y: auto;
  }

  .slide-category {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gold);
    text-align: center;
    margin-bottom: 5px;
  }
  .slide-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #eee;
    text-align: center;
    margin-bottom: 22px;
    line-height: 1.2;
  }

  .accordion {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .accordion-header {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    color: var(--cream);
    cursor: pointer;
    user-select: none;
  }
  .accordion-header .material-symbols-rounded {
    color: var(--gold);
    transition: transform 0.3s;
  }
  .accordion.active {
    background: rgba(212,175,55,0.05);
    border-color: rgba(212,175,55,0.3);
  }
  .accordion.active .accordion-header .material-symbols-rounded {
    transform: rotate(180deg);
  }
  .accordion-body {
    padding: 0 16px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out, padding 0.3s ease-out;
    color: var(--cream-mute);
    line-height: 1.6;
    font-size: 14px;
  }
  .accordion.active .accordion-body {
    padding: 0 16px 16px 16px;
    max-height: 1200px;
  }
  .accordion-body ul {
    padding-left: 20px;
    margin: 10px 0 0 0;
  }
  .accordion-body li {
    margin-bottom: 6px;
  }
  .accordion-body li::marker {
    color: var(--gold);
  }

  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-top: 10px;
    flex-wrap: wrap;
    padding: 0 20px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: 0.3s;
  }
  .dot.active {
    background: var(--gold);
    transform: scale(1.3);
  }

  .intro-text p { margin-bottom: 15px; color: var(--cream-mute); line-height: 1.6; font-size: 14px; }
  .intro-text ul { padding-left: 20px; margin-bottom: 15px; color: var(--cream-mute); font-size: 14px; }
  .intro-text li { margin-bottom: 8px; }
  .intro-text li::marker { color: var(--gold); }

  .sequence-box { background: var(--glass); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: 15px 20px; border-radius: 8px; margin-bottom: 15px; }
  .sequence-box strong { color: var(--gold); display: block; margin-bottom: 5px; font-size: 14px;}
  .sequence-box p { font-size: 14px; margin-bottom: 5px; color: #eee; }
  .sequence-box span { font-size: 12px; color: var(--cream-mute); }

  .mark-read-btn { display: block; width: 100%; max-width: 300px; margin: 40px auto 20px; padding: 16px; background: var(--gold); color: #000; text-align: center; border: none; border-radius: 25px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.3s; }
  .mark-read-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
  .mark-read-btn .material-symbols-rounded { vertical-align: middle; margin-right: 8px; font-size: 20px; }
</style>

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function buildAccordion(title, content) {
    let contentHtml = content;
    if (Array.isArray(content)) {
      contentHtml = '<ul>' + content.map(i => `<li>${i}</li>`).join('') + '</ul>';
    } else {
      contentHtml = String(content).replace(/\n/g, '<br>');
    }
    return `
      <div class="accordion" onclick="this.classList.toggle('active')">
        <div class="accordion-header">
          ${title}
          <span class="material-symbols-rounded">expand_more</span>
        </div>
        <div class="accordion-body">${contentHtml}</div>
      </div>
    `;
  }

  function renderSlides() {
    const carousel = document.getElementById('carousel');
    let html = '';

    // Intro
    html += `
      <div class="carousel-slide">
        <div class="slide-category">Learning Guide</div>
        <div class="slide-title">The 5 Protocol</div>
        <div class="intro-text">
          <p>This is the study material for orgasm on command under Sir’s control.</p>
          <p>Read it before and alongside practical training. The goal is not information. The goal is a trained response: when Sir says “5,” your body releases.</p>
          <p><strong>Learning path</strong></p>
          <ul>
            <li>Read this guide</li>
            <li>Practice the matching phase in training</li>
            <li>Use flashcards and quizzes to lock the rules</li>
            <li>Report honestly. Always.</li>
          </ul>
          <p style="text-align:center; margin-top:30px; font-weight:600; color:var(--gold);">Swipe left to begin <span class="material-symbols-rounded" style="vertical-align:middle;font-size:18px;">arrow_forward</span></p>
        </div>
      </div>
    `;

    sections.forEach(s => {
      html += `
        <div class="carousel-slide">
          <div class="slide-category">${s.category}</div>
          <div class="slide-title">${s.title}</div>
          ${s.blocks.map(b => buildAccordion(b.label, b.content)).join('')}
        </div>
      `;
    });

    // Review
    html += `
      <div class="carousel-slide">
        <div class="slide-category">Review</div>
        <div class="slide-title">Path &amp; Principles</div>

        <div class="sequence-box">
          <strong>Conditioning path</strong>
          <p>Awareness → Edge control → Exact pairing → Reduced stimulation → Maintenance</p>
          <span>Build the association first, then transfer control more fully to the verbal cue.</span>
        </div>

        <div class="sequence-box">
          <strong>Permission path</strong>
          <p>Ask → Normal permission → Replace with “5” → “5” before the ask</p>
          <span>Gradually transfers the release trigger from ordinary permission to the trained command.</span>
        </div>

        <div class="sequence-box">
          <strong>Failure path</strong>
          <p>Stop → Calm → Honest report → Retry when ready</p>
          <span>Honest misses are data. They refine timing; they are not treated as disobedience.</span>
        </div>

        <div class="intro-text" style="margin-top:20px;">
          <p><strong>Standing principles</strong></p>
          <ul>
            <li>Exact timing of command and climax</li>
            <li>Consistent tone is part of the cue</li>
            <li>Honesty protects the process</li>
            <li>Reinforcement keeps the response alive</li>
            <li>Release is a grant controlled by Sir</li>
          </ul>
        </div>

        <button class="mark-read-btn" id="markReadBtn">
          <span class="material-symbols-rounded">check_circle</span> Mark as Read
        </button>
      </div>
    `;

    carousel.innerHTML = html;

    const totalSlides = 1 + sections.length + 1;
    const dotsContainer = document.getElementById('dotsContainer');
    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dotsContainer.appendChild(dot);
    }

    carousel.addEventListener('scroll', () => {
      const index = Math.round(carousel.scrollLeft / carousel.offsetWidth);
      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
    });
  }

  async function init() {
    renderSlides();
    user = await requireAuth();

    document.getElementById('markReadBtn').onclick = async () => {
      const btn = document.getElementById('markReadBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-rounded">sync</span> Saving...';
      try {
        await addDoc(collection(db, 'trainingActivity'), {
          uid: user.uid,
          topicId: 'the-5-protocol',
          type: 'read_guide',
          title: 'The 5 Protocol Learning Guide',
          timestamp: serverTimestamp()
        });
        showToast('Guide marked as read!');
        btn.innerHTML = '<span class="material-symbols-rounded">task_alt</span> Read Logged';
      } catch (e) {
        console.error(e);
        showToast('Failed to log activity.');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-rounded">check_circle</span> Mark as Read';
      }
    };
  }

  init().catch(console.error);
</script>
<script src="nav.js"></script>
