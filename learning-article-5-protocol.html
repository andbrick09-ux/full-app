<style>
  html, body {

  }
  .topbar { display:flex; align-items:center; gap:12px; }

  .carousel-slide {

    padding: 0 15px 80px 15px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  
  .slide-category {

  .accordion {

    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .accordion-header {

    justify-content: space-between;
    align-items: center;

    font-weight: 500;
    color: var(--cream);
    cursor: pointer;

  }
  .accordion-header .material-symbols-rounded {
    color: var(--gold);
    transition: transform 0.3s;
  }
  .accordion.active {
    background: rgba(212,175,55,0.05);
    border-color: rgba(212,175,55,0.3);
  }
  .accordion.active .accordion-header .material-symbols-rounded {
    transform: rotate(180deg);
  }
  .accordion-body {
    padding: 0 16px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out, padding 0.3s ease-out;
    color: var(--cream-mute);
    line-height: 1.6;
    font-size: 14px;
  }
  .accordion.active .accordion-body {
    padding: 0 16px 16px 16px;
    max-height: 1000px;
  }
  .accordion-body ul {
    padding-left: 20px;
    margin: 10px 0 0 0;
  }
  .accordion-body li {
    margin-bottom: 6px;
  }
  .accordion-body li::marker {
    color: var(--gold);
  }

  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-top: 10px;
    flex-wrap: wrap;
    padding: 0 20px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: 0.3s;
  }
  .dot.active {
    background: var(--gold);
    transform: scale(1.3);
  }

  .intro-text ul { padding-left: 20px; margin-bottom: 15px; color: var(--cream-mute); font-size: 14px; }
  .intro-text li { margin-bottom: 8px; }
  .intro-text li::marker { color: var(--gold); }

  .mark-read-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function buildAccordion(title, content) {
    let contentHtml = content;
    if (Array.isArray(content)) {
      contentHtml = '<ul>' + content.map(i => `<li>${i}</li>`).join('') + '</ul>';
    }
    return `
      <div class="accordion" onclick="this.classList.toggle('active')">
        <div class="accordion-header">
          ${title}
          <span class="material-symbols-rounded">expand_more</span>
        </div>
        <div class="accordion-body">${contentHtml}</div>
      </div>
    `;
  }

    // SLIDE 1: Intro

        <div class="slide-category">Learning Guide</div>
        <div class="slide-title">The 5 Protocol</div>

            <li>Practice the corresponding phase in the interactive training page</li>
            <li>Review flashcards for recognition of rules and principles</li>
            <li>Test yourself with true/false and multiple-choice questions</li>

          <p style="text-align:center; margin-top:30px; font-weight:600; color:var(--gold);">Swipe left to begin <span class="material-symbols-rounded" style="vertical-align:middle;font-size:18px;">arrow_forward</span></p>
        </div>
      </div>
    `;

      html += `

          <div class="slide-category">${s.category}</div>
          <div class="slide-title">${s.title}</div>
          ${buildAccordion('Form', s.form)}

          ${buildAccordion('What the Submissive Learns', s.learns)}
          ${buildAccordion('What Is Gained', s.gains)}
          ${buildAccordion('Common Mistakes', s.mistakes)}
          ${buildAccordion('Key Transitions', s.transitions)}
        </div>
      `;
    });

      dotsContainer.appendChild(dot);

    renderSlides();

      const btn = document.getElementById('markReadBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-rounded">sync</span> Saving...';

      try {
        await addDoc(collection(db, 'trainingActivity'), {

          topicId: 'the-5-protocol',
          type: 'read_guide',
          title: 'The 5 Protocol Learning Guide',
          timestamp: serverTimestamp()

        showToast('Guide marked as read!');
        btn.innerHTML = '<span class="material-symbols-rounded">task_alt</span> Read Logged';

        console.error(e);
        showToast('Failed to log activity.');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-rounded">check_circle</span> Mark as Read';

  init().catch(console.error);
