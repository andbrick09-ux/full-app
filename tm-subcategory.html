<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080c14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Dom Sub Hub — Items</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,1,0&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="nav.css"/>
<style>
  .topbar{display:flex;align-items:center;gap:12px}
  .back-btn{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(212,175,55,.08);border:1px solid var(--border);text-decoration:none;cursor:pointer}
  .back-btn:active{opacity:.7;transform:scale(.93)}
  .back-btn .material-symbols-rounded{font-size:20px;color:var(--gold)}
  .diff-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
  .diff-tab{background:transparent;border:1px solid var(--border);border-radius:25px;color:rgba(212,175,55,.6);font-size:10px;font-weight:600;padding:9px 16px;cursor:pointer;text-transform:uppercase;letter-spacing:1.5px;transition:.3s}
  .diff-tab.active{background:var(--luxury-gradient);color:var(--midnight);border-color:transparent;font-weight:700}
  .item-row{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer}
  .item-row:active{transform:scale(.98)}
  .item-type-icon{width:36px;height:36px;border-radius:10px;background:rgba(212,175,55,.06);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .item-type-icon .material-symbols-rounded{color:var(--gold);font-size:17px}
  .item-info{flex:1;min-width:0}
  .item-title{font-size:13px;color:#ddd;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-meta{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px}
  .status-badge{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:4px 9px;border-radius:20px;flex-shrink:0}
  .status-not_started{background:rgba(107,114,128,.15);color:#9CA3AF}
  .status-in_progress{background:rgba(59,130,246,.15);color:#60A5FA}
  .status-completed{background:rgba(34,197,94,.15);color:#4ADE80}
  .status-mastered{background:rgba(212,175,55,.15);color:var(--gold)}
  .empty-state{text-align:center;padding:50px 20px;color:#777}
</style>
</head>
<body data-nav="more">

<div class="topbar">
  <a class="back-btn" id="backLink" href="tm-hub.html"><span class="material-symbols-rounded">arrow_back</span></a>
  <div class="topbar-center">
    <div class="topbar-title" id="subTitle">Subcategory</div>
    <div class="topbar-sub">Training</div>
  </div>
</div>

<div class="main">
  <div class="diff-tabs" id="diffTabs">
    <button class="diff-tab active" data-diff="all">All</button>
    <button class="diff-tab" data-diff="beginner">Beginner</button>
    <button class="diff-tab" data-diff="intermediate">Intermediate</button>
    <button class="diff-tab" data-diff="advanced">Advanced</button>
  </div>
  <div id="itemList"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { requireAuth } from './auth.js';
  import { collection, doc, getDoc, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { db } from './firebase-config.js';

  const TYPE_ICONS = {
    flashcard: 'style', multiple_choice: 'quiz', true_false: 'check_circle',
    fill_blank: 'edit_note', error_identification: 'search', transition: 'sync_alt',
    sequence: 'timeline', scenario: 'psychology', hold_practice: 'timer',
    reflection: 'self_improvement', comparison: 'compare_arrows',
  };

  const params = new URLSearchParams(window.location.search);
  const topicId = params.get('topic');
  const subId = params.get('sub');

  let allItems = [];
  let progressByItemId = {};
  let currentFilter = 'all';

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function render() {
    const listEl = document.getElementById('itemList');
    listEl.innerHTML = '';
    const filtered = currentFilter === 'all' ? allItems : allItems.filter(i => i.difficulty === currentFilter);

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty-state">No items at this difficulty yet.</div>`;
      return;
    }

    for (const item of filtered.sort((a, b) => (a.order ?? 0) - (b.order ?? 0))) {
      const progress = progressByItemId[item.id];
      const status = progress?.status ?? 'not_started';
      const meta = item.type === 'hold_practice' && progress?.bestHoldSeconds
        ? `${item.difficulty} · best ${progress.bestHoldSeconds}s`
        : (progress?.score != null ? `${item.difficulty} · ${progress.score}%` : item.difficulty);

      const row = document.createElement('div');
      row.className = 'glass-card item-row';
      row.innerHTML = `
        <div class="item-type-icon"><span class="material-symbols-rounded">${TYPE_ICONS[item.type] || 'article'}</span></div>
        <div class="item-info">
          <div class="item-title">${item.title}</div>
          <div class="item-meta">${meta}</div>
        </div>
        <div class="status-badge status-${status}">${status.replace('_', ' ')}</div>
      `;
      row.onclick = () => {
        window.location.href = `tm-session.html?topic=${encodeURIComponent(topicId)}&sub=${encodeURIComponent(subId)}&item=${encodeURIComponent(item.id)}`;
      };
      listEl.appendChild(row);
    }
  }

  async function init() {
    if (!topicId || !subId) { showToast('Missing topic/subcategory.'); return; }
    const user = await requireAuth();
    document.getElementById('backLink').href = `tm-topic.html?topic=${encodeURIComponent(topicId)}`;

    const subSnap = await getDoc(doc(db, 'trainingSubcategories', subId));
    if (subSnap.exists()) document.getElementById('subTitle').textContent = subSnap.data().title;

    const itemsSnap = await getDocs(query(
      collection(db, 'trainingItems'),
      where('topicId', '==', topicId),
      where('subcategoryId', '==', subId),
      where('isActive', '==', true)
    ));
    allItems = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const progressSnap = await getDocs(query(
      collection(db, 'userTrainingProgress'),
      where('submissiveId', '==', user.uid),
      where('subcategoryId', '==', subId)
    ));
    progressByItemId = {};
    progressSnap.forEach(d => { progressByItemId[d.data().itemId] = d.data(); });

    render();

    document.getElementById('diffTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.diff-tab');
      if (!btn) return;
      document.querySelectorAll('.diff-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.diff;
      render();
    });
  }

  init().catch(err => { console.error(err); showToast('Failed to load items.'); });
</script>

<script src="nav.js"></script>
</body>
</html>
