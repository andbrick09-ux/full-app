<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080c14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Dom Sub Hub — My Assignments</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,1,0&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="nav.css"/>
<style>
  .topbar{display:flex;align-items:center;gap:12px}
  .back-btn{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(212,175,55,.08);border:1px solid var(--border);text-decoration:none;cursor:pointer}
  .back-btn .material-symbols-rounded{font-size:20px;color:var(--gold)}
  .assignment-card{padding:18px 20px;margin-bottom:14px}
  .assignment-status{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;border-radius:10px;display:inline-block;margin-bottom:8px}
  .status-active{background:rgba(59,130,246,.15);color:#60A5FA}
  .status-completed{background:rgba(34,197,94,.15);color:#4ADE80}
  .status-overdue{background:rgba(244,67,54,.15);color:#F44336}
  .assignment-title{font-family:'Playfair Display',serif;font-size:15px;color:#eee;margin-bottom:4px}
  .assignment-meta{font-size:10px;color:#888;margin-bottom:10px}
  .assignment-instructions{font-size:12px;color:#aaa;line-height:1.6;margin-bottom:14px}
  .empty-state{text-align:center;padding:60px 20px;color:#777}
</style>
</head>
<body data-nav="more">

<div class="topbar">
  <a class="back-btn" href="tm-hub.html"><span class="material-symbols-rounded">arrow_back</span></a>
  <div class="topbar-center">
    <div class="topbar-title">My Assignments</div>
  </div>
</div>

<div class="main" id="mainContent">
  <div style="text-align:center;padding:60px;color:#777;">Loading…</div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { requireAuth } from './auth.js';
  import { collection, doc, getDoc, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { db } from './firebase-config.js';

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function init() {
    const user = await requireAuth();
    const snap = await getDocs(query(collection(db, 'trainingAssignments'), where('submissiveIds', 'array-contains', user.uid)));
    const assignments = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds ?? 0) - (a.createdAt?.seconds ?? 0));

    const main = document.getElementById('mainContent');
    if (assignments.length === 0) {
      main.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-rounded" style="font-size:36px;color:var(--gold-dim);display:block;margin-bottom:10px;">assignment</span>
          No assignments yet.
        </div>`;
      return;
    }

    main.innerHTML = '';
    const now = new Date();
    for (const a of assignments) {
      const topicSnap = await getDoc(doc(db, 'trainingTopics', a.topicId));
      const topic = topicSnap.exists() ? topicSnap.data() : null;
      const due = a.dueDate ? new Date(a.dueDate) : null;
      const isOverdue = a.status === 'active' && due && due < now;
      const displayStatus = isOverdue ? 'overdue' : a.status;

      const card = document.createElement('div');
      card.className = 'glass-card assignment-card';
      card.innerHTML = `
        <div class="assignment-status status-${displayStatus}">${displayStatus}</div>
        <div class="assignment-title">${a.title}</div>
        <div class="assignment-meta">${topic ? topic.title : ''}${due ? ` · Due ${due.toLocaleDateString()}` : ''}</div>
        ${a.instructions ? `<div class="assignment-instructions">${a.instructions}</div>` : ''}
        ${a.status === 'active' ? `<button class="gold-btn" data-topic="${a.topicId}" data-sub="${a.subcategoryId || ''}">Start</button>` : ''}
      `;
      const startBtn = card.querySelector('[data-topic]');
      if (startBtn) startBtn.onclick = () => {
        const t = startBtn.dataset.topic, s = startBtn.dataset.sub;
        window.location.href = s
          ? `tm-subcategory.html?topic=${encodeURIComponent(t)}&sub=${encodeURIComponent(s)}`
          : `tm-topic.html?topic=${encodeURIComponent(t)}`;
      };
      main.appendChild(card);
    }
  }

  init().catch(err => { console.error(err); showToast('Failed to load assignments.'); });
</script>

<script src="nav.js"></script>
</body>
</html>
