<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080c14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Dom Sub Hub - Learning Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,1,0&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="nav.css"/>
<style>
  html, body {
    overflow: hidden; /* Prevent vertical scrolling */
    height: 100vh;
  }
  .topbar { display:flex; align-items:center; gap:12px; }
  .close-btn { width:36px; height:36px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:rgba(212,175,55,.08); border:1px solid var(--border); text-decoration:none; cursor:pointer; }
  .close-btn .material-symbols-rounded { font-size:20px; color:var(--gold); }
  
  .helper-text {
    text-align: center;
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 10px 0 20px 0;
  }
  
  .helper-text .material-symbols-rounded {
    font-size: 14px;
    vertical-align: middle;
    margin: 0 4px;
  }

  /* Carousel */
  .carousel-container {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch; /* for iOS */
    padding-bottom: 20px;
    gap: 20px;
  }
  
  /* Hide scrollbar for a cleaner look */
  .carousel-container::-webkit-scrollbar {
    display: none;
  }
  .carousel-container {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .carousel-slide {
    flex: 0 0 100%;
    scroll-snap-align: center;
    padding: 0 10px;
    box-sizing: border-box;
  }

  /* Flashcard */
  .flip-card { perspective: 1200px; height: 350px; width: 100%; }
  .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; cursor: pointer; }
  .flip-card-inner.flipped { transform: rotateY(180deg); }
  
  .flip-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 20px; background: var(--glass); border: 1.5px solid var(--border);
    display: flex;
    padding: 24px 10px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .flip-face.back { transform: rotateY(180deg); background: rgba(212,175,55,0.05); }
  
  .flip-face-text { 
    font-family: 'Playfair Display', serif; font-size: 18px; color: #eee; line-height: 1.6; white-space: pre-line;
    margin: auto;
    max-height: 100%; width: 100%; overflow-y: auto; padding: 0 14px; box-sizing: border-box;
  }
  .flip-face-text::-webkit-scrollbar { width: 4px; }
  .flip-face-text::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  .flip-face.front .flip-face-text { font-size: 28px; color: var(--gold); }
  
  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: 0.3s;
  }
  .dot.active {
    background: var(--gold);
    transform: scale(1.3);
  }

  .empty-state { text-align:center; padding:50px 20px; color:#777; }
</style>
</head>
<body data-nav="learning">

<div class="topbar">
  <a class="close-btn" id="closeLink" href="learning-hub.html"><span class="material-symbols-rounded">close</span></a>
  <div class="topbar-center">
    <div class="topbar-title" id="pageTitle">Learning Viewer</div>
  </div>
</div>

<div class="main" style="display: flex; flex-direction: column; height: calc(100vh - 140px);">
  
  <div class="helper-text">
    <span class="material-symbols-rounded">swipe_left</span>
    Swipe to browse • Tap to flip
    <span class="material-symbols-rounded">swipe_right</span>
  </div>

  <div class="carousel-container" id="carousel">
    <div class="empty-state">Loading flashcards...</div>
  </div>
  
  <div class="progress-dots" id="dotsContainer"></div>

</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { requireAuth } from './auth.js';
  import { collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { db } from './firebase-config.js';

  const params = new URLSearchParams(window.location.search);
  const topicId = params.get('topic');
  const subcategoryId = params.get('sub');

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function init() {
    if (!topicId || !subcategoryId) {
      showToast('Missing topic or subcategory.');
      return;
    }

    document.getElementById('closeLink').href = `learning-topic.html?topic=${encodeURIComponent(topicId)}`;
    await requireAuth();

    try {
      // Fetch only flashcards for this subcategory
      const itemsSnap = await getDocs(query(
        collection(db, 'trainingItems'),
        where('topicId', '==', topicId),
        where('subcategoryId', '==', subcategoryId),
        where('type', '==', 'flashcard'),
        where('isActive', '==', true)
      ));

      let cards = itemsSnap.docs.map(d => d.data());
      cards.sort((a, b) => (a.order || 0) - (b.order || 0));

      const carousel = document.getElementById('carousel');
      const dotsContainer = document.getElementById('dotsContainer');

      if (cards.length === 0) {
        carousel.innerHTML = `<div class="empty-state">No flashcards found in this section.</div>`;
        return;
      }

      carousel.innerHTML = '';
      dotsContainer.innerHTML = '';

      cards.forEach((card, index) => {
        // Create slide
        const slide = document.createElement('div');
        slide.className = 'carousel-slide';
        
        slide.innerHTML = `
          <div class="flip-card">
            <div class="flip-card-inner" onclick="this.classList.toggle('flipped')">
              <div class="flip-face front">
                <div class="flip-face-text">${card.front}</div>
              </div>
              <div class="flip-face back">
                <div class="flip-face-text">${card.back}</div>
              </div>
            </div>
          </div>
        `;
        carousel.appendChild(slide);

        // Create dot
        const dot = document.createElement('div');
        dot.className = 'dot' + (index === 0 ? ' active' : '');
        dotsContainer.appendChild(dot);
      });

      // Update dots on scroll
      carousel.addEventListener('scroll', () => {
        const index = Math.round(carousel.scrollLeft / carousel.offsetWidth);
        const dots = dotsContainer.querySelectorAll('.dot');
        dots.forEach((dot, i) => {
          dot.classList.toggle('active', i === index);
        });
      });

    } catch (e) {
      console.error(e);
      showToast('Failed to load flashcards.');
    }
  }

  init().catch(e => console.error(e));
</script>

<script src="nav.js"></script>
</body>
</html>
