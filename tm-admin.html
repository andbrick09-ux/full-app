<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080c14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Dom Sub Hub — Training Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,1,0&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="nav.css"/>
<style>
  .topbar{display:flex;align-items:center;gap:12px}
  .close-btn{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(212,175,55,.08);border:1px solid var(--border);text-decoration:none;cursor:pointer}
  .close-btn .material-symbols-rounded{font-size:20px;color:var(--gold)}
  .topic-row{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:10px}
  .topic-row-main{flex:1;min-width:0;cursor:pointer}
  .topic-row-title{font-family:'Playfair Display',serif;font-size:15px;color:#eee}
  .topic-row-meta{font-size:10px;color:#888;margin-top:3px}
  .pub-toggle{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
  .pub-toggle.on{background:var(--luxury-gradient);border-color:transparent}
  .pub-toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .pub-toggle.on::after{transform:translateX(18px);background:var(--midnight)}
  .text-input{width:100%;padding:12px;background:var(--glass2);border:1.5px solid var(--border);border-radius:10px;color:#eee;font-size:13px;font-family:'Montserrat',sans-serif;margin-bottom:12px}
  textarea.text-input{min-height:70px;resize:vertical}
  .field-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:6px;display:block}
  .form-card{padding:20px;margin-bottom:20px}
  .form-row{display:flex;gap:10px}
  .form-row .text-input{flex:1}
  .access-denied{text-align:center;padding:60px 20px}
  .access-denied .material-symbols-rounded{font-size:40px;color:#F44336;margin-bottom:12px;display:block}
</style>
</head>
<body data-nav="more">

<div class="topbar">
  <a class="close-btn" href="tm-hub.html"><span class="material-symbols-rounded">close</span></a>
  <div class="topbar-center">
    <div class="topbar-title">Training Admin</div>
    <div class="topbar-sub">Content Dashboard</div>
  </div>
</div>

<div class="main" id="mainContent">
  <div style="text-align:center;padding:60px;color:#777;">Loading…</div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { requireAuth, getMyProfile } from './auth.js';
  import {
    collection, doc, setDoc, getDoc, getDocs, query, where, deleteDoc
  } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { db } from './firebase-config.js';

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function slugify(s) {
    return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || `topic-${Date.now()}`;
  }

  async function renderDashboard() {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
      <div style="text-align:right; margin-bottom: 16px;">
        <button onclick="window.location.href='seed-tm.html'" class="settings-danger-btn" style="padding: 8px 16px; font-size: 11px; width: auto; margin:0; background:rgba(212,175,55,.1); border:1px solid var(--gold); color:var(--gold); margin-right:8px;">Open Seeder</button>
        <button id="wipeDataBtn" class="settings-danger-btn" style="padding: 8px 16px; font-size: 11px; width: auto; margin:0">Wipe Training Database</button>
      </div>
      <div class="glass-card form-card">
        <span class="field-label">Add New Topic</span>
        <input class="text-input" id="newTitle" placeholder="Title"/>
        <textarea class="text-input" id="newDesc" placeholder="Description"></textarea>
        <div class="form-row">
          <input class="text-input" id="newIcon" placeholder="Icon (e.g. body)"/>
          <input class="text-input" id="newOrder" type="number" placeholder="Order" value="1"/>
        </div>
        <button class="gold-btn" id="addTopicBtn">Create Topic</button>
      </div>
      <div id="topicList"></div>
    `;

    document.getElementById('wipeDataBtn').onclick = async () => {
      if (!confirm('Are you absolutely sure you want to WIPE all Training Topics, Subcategories, and Items? This cannot be undone!')) return;
      if (!confirm('Final warning: All training content will be deleted immediately.')) return;
      
      const btn = document.getElementById('wipeDataBtn');
      btn.textContent = 'Wiping...';
      btn.disabled = true;

      try {
        const collectionsToWipe = ['trainingTopics', 'trainingSubcategories', 'trainingItems'];
        for (const coll of collectionsToWipe) {
          const snap = await getDocs(collection(db, coll));
          for (const d of snap.docs) {
            await deleteDoc(doc(db, coll, d.id));
          }
        }
        showToast('Database wiped successfully!');
        renderDashboard();
      } catch (err) {
        console.error(err);
        showToast('Error wiping data: ' + err.message);
        btn.textContent = 'Wipe Training Database';
        btn.disabled = false;
      }
    };

    document.getElementById('addTopicBtn').onclick = async () => {
      const title = document.getElementById('newTitle').value.trim();
      if (!title) { showToast('Title is required.'); return; }
      const id = slugify(title);
      await setDoc(doc(db, 'trainingTopics', id), {
        title,
        description: document.getElementById('newDesc').value.trim(),
        icon: document.getElementById('newIcon').value.trim() || 'menu_book',
        order: parseInt(document.getElementById('newOrder').value, 10) || 1,
        isPublished: false,
        createdBy: (await requireAuth()).uid,
      }, { merge: true });
      showToast('Topic created — leave unpublished until content is ready.');
      renderDashboard();
    };

    const topicsSnap = await getDocs(collection(db, 'trainingTopics'));
    const topics = topicsSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const listEl = document.getElementById('topicList');
    listEl.innerHTML = '';

    if (topics.length === 0) {
      listEl.innerHTML = `<div style="text-align:center;padding:30px;color:#777;">No topics yet — create one above.</div>`;
      return;
    }

    for (const topic of topics) {
      const [subsSnap, itemsSnap] = await Promise.all([
        getDocs(query(collection(db, 'trainingSubcategories'), where('topicId', '==', topic.id))),
        getDocs(query(collection(db, 'trainingItems'), where('topicId', '==', topic.id))),
      ]);

      const row = document.createElement('div');
      row.className = 'glass-card topic-row';
      row.innerHTML = `
        <div class="topic-row-main">
          <div class="topic-row-title">${topic.title}</div>
          <div class="topic-row-meta">${subsSnap.size} subcategor${subsSnap.size === 1 ? 'y' : 'ies'} · ${itemsSnap.size} item${itemsSnap.size === 1 ? '' : 's'}</div>
        </div>
        <div class="pub-toggle ${topic.isPublished ? 'on' : ''}" data-id="${topic.id}" data-pub="${topic.isPublished ? '1' : '0'}"></div>
      `;
      row.querySelector('.topic-row-main').onclick = () => {
        window.location.href = `tm-admin-topic.html?topic=${encodeURIComponent(topic.id)}`;
      };
      row.querySelector('.pub-toggle').onclick = async (e) => {
        e.stopPropagation();
        const btn = e.currentTarget;
        const newVal = btn.dataset.pub !== '1';
        await setDoc(doc(db, 'trainingTopics', topic.id), { isPublished: newVal }, { merge: true });
        btn.classList.toggle('on', newVal);
        btn.dataset.pub = newVal ? '1' : '0';
        showToast(newVal ? 'Topic published.' : 'Topic unpublished.');
      };
      listEl.appendChild(row);
    }
  }

  async function init() {
    await requireAuth();
    const profile = await getMyProfile();
    if (profile?.role !== 'admin' && profile?.isAdmin !== true) {
      document.getElementById('mainContent').innerHTML = `
        <div class="glass-card access-denied">
          <span class="material-symbols-rounded">block</span>
          <div style="font-family:'Playfair Display',serif;color:#eee;font-size:16px;margin-bottom:8px;">Admin Access Required</div>
          <div style="font-size:12px;color:#888;">This page requires the Admin role.</div>
        </div>`;
      return;
    }
    await renderDashboard();
  }

  init().catch(err => { console.error(err); showToast('Failed to load admin dashboard.'); });
</script>

<script src="nav.js"></script>
</body>
</html>
