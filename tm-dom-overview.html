<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#080c14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Dom Sub Hub — Training Overview</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,1,0&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="nav.css"/>
<style>
  .topbar{display:flex;align-items:center;gap:12px}
  .close-btn{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(212,175,55,.08);border:1px solid var(--border);text-decoration:none;cursor:pointer}
  .close-btn .material-symbols-rounded{font-size:20px;color:var(--gold)}
  .sub-card{display:flex;align-items:center;gap:14px;padding:18px 20px;margin-bottom:14px;cursor:pointer}
  .sub-card:active{transform:scale(.98)}
  .sub-avatar{width:46px;height:46px;border-radius:50%;background:var(--luxury-gradient);color:var(--midnight);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:16px;flex-shrink:0}
  .sub-info{flex:1;min-width:0}
  .sub-name{font-family:'Playfair Display',serif;font-size:15px;color:#eee}
  .sub-meta{font-size:10px;color:#888;margin-top:3px}
  .sub-progress-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:8px}
  .sub-progress-fill{height:100%;background:var(--luxury-gradient);border-radius:3px}
  .sub-pct{font-size:15px;color:var(--gold);font-weight:700;flex-shrink:0}
  .assign-badge{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;border-radius:10px;background:rgba(212,175,55,.1);color:var(--gold);margin-top:6px;display:inline-block}
  .empty-state{text-align:center;padding:60px 20px;color:#777}
</style>
</head>
<body data-nav="more">

<div class="topbar">
  <a class="close-btn" href="tm-hub.html"><span class="material-symbols-rounded">close</span></a>
  <div class="topbar-center">
    <div class="topbar-title">Training Overview</div>
    <div class="topbar-sub">Your Submissives</div>
  </div>
</div>

<div class="main" id="mainContent">
  <div style="text-align:center;padding:60px;color:#777;">Loading…</div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { requireAuth, getMyProfile, getMySubmissives } from './auth.js';
  import { collection, getDocs, query, where, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { db } from './firebase-config.js';
  import { calculateTopicMastery } from './training.js';

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function timeAgo(date) {
    if (!date) return 'No activity yet';
    const diffMs = Date.now() - date.getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return `${days}d ago`;
  }

  async function init() {
    await requireAuth();
    const profile = await getMyProfile();
    if (profile?.role !== 'dom' && profile?.role !== 'admin' && profile?.isAdmin !== true) {
      document.getElementById('mainContent').innerHTML = `<div style="text-align:center;padding:60px;color:#888;">This view is for Dominants/Admins.</div>`;
      return;
    }

    const subs = await getMySubmissives();
    const main = document.getElementById('mainContent');

    if (subs.length === 0) {
      main.innerHTML = `
        <div class="empty-state">
          <span class="material-symbols-rounded" style="font-size:36px;color:var(--gold-dim);display:block;margin-bottom:10px;">group_off</span>
          No paired submissives yet.
        </div>`;
      return;
    }

    // All active items across all topics — shared across every sub, fetch once.
    const allItemsSnap = await getDocs(query(collection(db, 'trainingItems'), where('isActive', '==', true)));
    const allItemIds = allItemsSnap.docs.map(d => d.id);

    main.innerHTML = '';
    for (const sub of subs) {
      const [progressSnap, activitySnap, assignSnap] = await Promise.all([
        getDocs(query(collection(db, 'userTrainingProgress'), where('submissiveId', '==', sub.uid))),
        getDocs(query(collection(db, 'trainingActivityLog'), where('submissiveId', '==', sub.uid), orderBy('createdAt', 'desc'), limit(1))),
        getDocs(query(collection(db, 'trainingAssignments'), where('submissiveIds', 'array-contains', sub.uid), where('status', '==', 'active'))),
      ]);

      const progressByItemId = {};
      progressSnap.forEach(d => { progressByItemId[d.data().itemId] = d.data(); });
      const pct = calculateTopicMastery(allItemIds, progressByItemId);

      const lastActivityDate = activitySnap.empty ? null : activitySnap.docs[0].data().createdAt?.toDate?.() ?? null;

      const card = document.createElement('div');
      card.className = 'glass-card sub-card';
      card.innerHTML = `
        <div class="sub-avatar">${(sub.displayName || '?').charAt(0).toUpperCase()}</div>
        <div class="sub-info">
          <div class="sub-name">${sub.displayName}</div>
          <div class="sub-meta">${timeAgo(lastActivityDate)}</div>
          <div class="sub-progress-bar"><div class="sub-progress-fill" style="width:${pct}%"></div></div>
          ${assignSnap.size > 0 ? `<span class="assign-badge">${assignSnap.size} active assignment${assignSnap.size === 1 ? '' : 's'}</span>` : ''}
        </div>
        <div class="sub-pct">${pct}%</div>
      `;
      card.onclick = () => { window.location.href = `tm-dom-detail.html?sub=${encodeURIComponent(sub.uid)}`; };
      main.appendChild(card);
    }
  }

  init().catch(err => { console.error(err); showToast('Failed to load overview.'); });
</script>

<script src="nav.js"></script>
</body>
</html>
