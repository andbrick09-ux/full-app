<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Assessments — BDSM Hub</title>
  
  <!-- Global Design System (matches Toy Vault V2 exactly) -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;family=Great+Vibes&amp;family=Montserrat:wght@400;600&amp;display=swap" rel="stylesheet">
  
  <style>
    /* === Sir's Protocol Global Tokens (V2) — EXACT MATCH TO TOY VAULT === */
    :root {
      --midnight: #051024;
      --glass: rgba(5,16,36,0.85);
      --glass2: rgba(2,8,20,0.6);
      --gold: #D4AF37;
      --gold-light: #F5E6A3;
      --gold-dim: rgba(212,175,55,0.18);
      --border: rgba(212,175,55,0.15);
      --cream: #f0e6d2;
      --cream-dim: rgba(240,230,211,0.7);
      --luxury-gradient: linear-gradient(135deg, #D4AF37, #F5E6A3);
      --dom-rose: #b76e79;
      --sub-cream: #f0e6d2;
      --danger: #c0392b;
      --success: #27ae60;
      --blue: #5dade2;
      --purple: #bb8fce;
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      background: var(--midnight);
      color: #ccc;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* === TOPBAR (exact from Toy Vault) === */
    .topbar {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      background: rgba(5,16,36,0.92);
      backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-title {
      font-family: 'Great Vibes', cursive;
      font-size: 28px;
      background: var(--luxury-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .topbar-sub {
      font-size: 10px; color: #666; letter-spacing: 1px; margin-top: 2px;
    }

    .main {
      max-width: 620px;
      margin: 0 auto;
      padding: 20px 16px 110px;
    }

    /* === TABS (exact from Toy Vault) === */
    .tabs {
      display: flex; background: var(--glass); border-radius: 9999px;
      padding: 4px; margin-bottom: 20px; border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 10px; text-align: center; font-size: 13px;
      font-weight: 600; letter-spacing: 0.5px; color: #aaa;
      border-radius: 9999px; transition: all .2s; cursor: pointer;
    }
    .tab-btn.active { background: var(--gold); color: #051024; font-weight: 700; }

    /* === GLASS CARD (exact from Toy Vault) === */
    .glass-card {
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 20px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    /* === ACTIVITY CARD (styled like Toy Row + enhanced for checklist) === */
    .activity-card {
      background: var(--glass2);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: all .2s;
      cursor: pointer;
    }
    .activity-card:active { transform: scale(0.985); }
    .activity-card.hard-limit { border-left: 4px solid #c0392b; }
    .activity-card.fetish-flag { border-left: 4px solid var(--gold); }
    .activity-card.loved-both { border-left: 4px solid #27ae60; }
    .activity-card.custom-item { border-left: 4px solid #5dade2; }
    .activity-card.scene-flagged { border-left: 4px solid #bb8fce; }

    .card-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; background: rgba(255,255,255,0.02);
    }
    .activity-name {
      font-family: 'Playfair Display', serif;
      font-size: 15px; color: #ddd; font-weight: 600; flex: 1;
    }
    .badge-row { display: flex; gap: 6px; align-items: center; }

    .status-pair {
      display: flex; align-items: center; gap: 2px;
      background: rgba(0,0,0,0.3); border-radius: 9999px; padding: 2px;
    }
    .sp-side {
      width: 22px; height: 22px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }
    .sp-side.me { background: #0a1628; color: var(--gold); }
    .sp-side.them { background: var(--dom-rose); color: #fff; }
    .sp-divider { width: 1px; height: 14px; background: #444; margin: 0 2px; }

    /* Hide partner side of status-pair in Me Only mode */
    body.view-me .sp-side.them,
    body.view-me .sp-divider { display: none; }
    /* Hide my side of status-pair in Partner Only mode */
    body.view-partner .sp-side.me,
    body.view-partner .sp-divider { display: none; }
    /* Remove background pill styling when only one side visible */
    body.view-me .status-pair,
    body.view-partner .status-pair { background: transparent; padding: 0; }

    .badge {
      font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
      letter-spacing: 0.3px; white-space: nowrap;
    }
    .badge.loved { background: rgba(39,174,96,0.2); color: #27ae60; border: 1px solid rgba(39,174,96,0.4); }
    .badge.liked { background: rgba(93,173,226,0.2); color: #5dade2; border: 1px solid rgba(93,173,226,0.4); }
    .badge.custom { background: rgba(93,173,226,0.15); color: #5dade2; }
    .badge.scene { background: rgba(187,143,206,0.15); color: #bb8fce; }

    .flag-btn {
      background: none; border: none; color: #555; font-size: 16px;
      padding: 4px; cursor: pointer; transition: color .2s;
    }
    .flag-btn.flagged { color: var(--gold); }

    .expand-icon { color: #666; font-size: 14px; margin-left: 4px; transition: transform .2s; }
    .activity-card.open .expand-icon { transform: rotate(180deg); }

    .card-body { display: none; padding: 0 16px 16px; }
    .activity-card.open .card-body { display: block; }

    .response-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .response-col {
      background: rgba(0,0,0,0.25); border-radius: 12px; padding: 12px;
    }

    /* View mode hiding (from original checklist) */
    body.view-me .theirs { display: none !important; }
    body.view-partner .mine { display: none !important; }
    body.view-me .response-grid, 
    body.view-partner .response-grid { 
      grid-template-columns: 1fr !important; 
    }
    .col-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      color: #888; margin-bottom: 8px;
    }
    .field-row { margin-bottom: 10px; }
    .field-label { font-size: 10px; color: #888; margin-bottom: 4px; }
    .partner-val { font-size: 13px; color: #ddd; padding: 6px 10px; background: rgba(255,255,255,0.05); border-radius: 8px; }
    .partner-val.empty { color: #555; font-style: italic; }
    .partner-note { font-size: 12px; color: #aaa; font-style: italic; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 8px; }

    /* === SWITCH / SEG / RATING CONTROLS (refined) === */
    .switch-row, .seg-control, .rating-row {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .switch-opt, .seg-btn, .rating-opt {
      flex: 1; padding: 6px 8px; font-size: 10px; font-weight: 600;
      text-align: center; border-radius: 9999px; cursor: pointer;
      transition: all .15s; border: 1px solid var(--border);
    }
    .switch-opt { background: var(--glass); color: #aaa; }
    .switch-opt.active-sw { background: var(--gold); color: #051024; border-color: var(--gold); }

    .seg-btn { background: var(--glass); color: #aaa; }
    .seg-btn.active-yes { background: #27ae60; color: #fff; border-color: #27ae60; }
    .seg-btn.active-want { background: #5dade2; color: #fff; border-color: #5dade2; }
    .seg-btn.active-no { background: #c0392b; color: #fff; border-color: #c0392b; }

    .rating-opt { flex-direction: column; align-items: center; padding: 8px 4px; font-size: 9px; }
    .rating-opt .r-icon { font-size: 16px; }
    .rating-opt.active-loved { background: #27ae60; color: #fff; border-color: #27ae60; }
    .rating-opt.active-liked { background: #5dade2; color: #fff; border-color: #5dade2; }
    .rating-opt.active-meh { background: #888; color: #fff; border-color: #888; }
    .rating-opt.active-na { background: #444; color: #aaa; border-color: #444; }

    /* === SMART BADGE (Again) === */
    .smart-badge {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--glass); border: 1px solid var(--border); border-radius: 9999px;
      padding: 8px 14px; font-size: 11px; cursor: pointer;
    }
    .smart-badge .sb-label { color: #ddd; }
    .smart-badge .sb-arrow { color: #666; }

    /* === FILTER CHIPS (now using .filter-pill style) === */
    .filter-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .chip {
      padding: 6px 14px; border-radius: 9999px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--border); color: #aaa; background: transparent;
      white-space: nowrap; transition: all .2s; cursor: pointer;
    }
    .chip.active { background: var(--gold); color: #051024; border-color: var(--gold); }
    .chip.active.danger-chip { background: #c0392b; color: #fff; border-color: #c0392b; }
    .chip.active.success-chip { background: #27ae60; color: #fff; border-color: #27ae60; }
    .chip.active.purple-chip { background: #bb8fce; color: #051024; border-color: #bb8fce; }

    /* === SEARCH === */
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-input {
      width: 100%; background: #0a1224; border: 1px solid var(--border);
      border-radius: 9999px; padding: 12px 18px 12px 44px; color: #ddd; font-size: 14px;
    }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #666; }

    /* === VIEW SELECTOR (pill style) === */
    .view-selector {
      display: flex; background: var(--glass); border: 1px solid var(--border);
      border-radius: 9999px; padding: 4px; margin-bottom: 16px;
    }
    .view-opt {
      flex: 1; padding: 8px; text-align: center; font-size: 11px; font-weight: 700;
      color: #aaa; border-radius: 9999px; cursor: pointer; transition: all .2s;
    }
    .view-opt.active { background: var(--gold); color: #051024; }

    /* === STATS === */
    .status-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 16px; }
    .stat-card {
      background: var(--glass); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 8px; text-align: center; cursor: pointer;
    }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold); }
    .stat-lbl { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    /* === MODALS (exact from Toy Vault) === */
    .modal-back {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px); z-index: 300;
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-back.open { opacity: 1; pointer-events: all; }
    .modal-sheet {
      width: 100%; max-width: 620px; background: var(--glass);
      border: 1px solid var(--border); border-radius: 24px 24px 0 0;
      padding: 8px 24px calc(32px + 80px);
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .modal-back.open .modal-sheet { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; background: #444; border-radius: 2px; margin: 12px auto 16px; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 18px; color: #ddd; text-align: center; margin-bottom: 20px; }

    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: #0a1224; border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; color: #ddd; font-size: 15px;
    }
    .form-textarea { min-height: 90px; resize: vertical; }

    .btn {
      padding: 14px 24px; border-radius: 14px; font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: .2s;
    }
    .btn-gold { background: var(--luxury-gradient); color: #051024; border: none; width: 100%; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: #aaa; }
    .btn-danger { background: transparent; border: 1px solid #F44336; color: #F44336; }

    .btn-icon {
      background: transparent; border: none; color: var(--gold);
      padding: 8px 10px; cursor: pointer; display: flex; align-items: center;
      transition: transform 0.1s ease;
    }
    .btn-icon:active { transform: scale(0.9); }

    /* === FLOATING ADD BUTTON (exact from Toy Vault) === */
    .fab {
      position: fixed; bottom: 90px; right: 20px; width: 56px; height: 56px;
      background: var(--luxury-gradient); color: #051024; border: none;
      border-radius: 50%; font-size: 28px; box-shadow: 0 6px 20px rgba(212,175,55,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 200;
      cursor: pointer;
    }

    .loading-overlay {
      position: fixed; inset: 0; background: var(--midnight);
      display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 16px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-title { font-family: 'Great Vibes', cursive; font-size: 36px; color: var(--gold); }
    .spinner { width: 32px; height: 32px; border: 2px solid var(--gold-dim); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .save-status { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; color: #666; }
    .save-status.saving { color: var(--gold); }
    .save-status.saved { color: #27ae60; }
    .save-status.error { color: #c0392b; }

    .section-panel { display: none; }
    .section-panel.active { display: block; }

    .search-empty { text-align: center; padding: 40px 20px; color: #666; font-style: italic; }
  </style>
  
  <link rel="stylesheet" href="nav.css">
</head>
<body data-nav="more">

  <!-- LOADING -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-title">BDSM Hub</div>
    <div class="spinner"></div>
    <div style="font-size:11px; color:#666; letter-spacing:1px;">SYNCING CHECKLIST</div>
  </div>

  <!-- TOPBAR (exact Toy Vault style) -->
  <div class="topbar">
    <div>
      <div class="topbar-title">Assessments</div>
      <div class="topbar-sub">BDSM CHECKLIST &amp; RATINGS</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div id="userPill" class="user-pill" style="background:var(--glass); border:1px solid var(--border); border-radius:20px; padding:4px 10px 4px 6px; font-size:10px; display:flex; align-items:center; gap:6px;">
        <div class="role-dot" style="width:6px; height:6px; border-radius:50%; background:var(--gold);"></div>
        <span id="userPillName" style="color:#ddd; font-weight:600;">You</span>
      </div>
      <div id="saveStatus" class="save-status">—</div>
    </div>
  </div>

  <div class="main">

    <!-- VIEW SELECTOR (pill tabs) -->
    <div class="view-selector">
      <div class="view-opt active" data-view="both" onclick="setViewMode('both')">Both</div>
      <div class="view-opt" data-view="me" onclick="setViewMode('me')">Me Only</div>
      <div class="view-opt" data-view="partner" onclick="setViewMode('partner')">Partner Only</div>
    </div>

    <!-- STATS -->
    <div class="status-bar">
      <div class="stat-card" onclick="document.querySelector('.chip[data-filter=all]').click()">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-lbl">Total</div>
      </div>
      <div class="stat-card" onclick="document.querySelector('.chip[data-filter=loved]').click()">
        <div class="stat-num" id="stat-loved">0</div>
        <div class="stat-lbl">Loved</div>
      </div>

        <div class="stat-num" id="stat-hard">0</div>
        <div class="stat-lbl">Hard Limits</div>
      </div>
      <div class="stat-card" onclick="document.querySelector('.chip[data-filter=scene]').click()">
        <div class="stat-num" id="stat-custom">0</div>
        <div class="stat-lbl">Custom</div>
      </div>
    </div>

    <!-- SEARCH + FILTERS + EXPAND/COLLAPSE (matches Toy Vault) -->
    <div style="display:flex; gap:8px; margin-bottom:16px; align-items:center;">
      <div class="search-wrap" style="flex:1; margin-bottom:0;">
        <input type="text" id="searchInput" class="search-input" placeholder="Search activities..." oninput="onSearch(this.value)">
        <span class="search-icon">🔍</span>
        <button onclick="clearSearch()" class="search-clear" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#666; font-size:18px; display:none;">×</button>
      </div>
      
      <button onclick="openFilterSheet()" class="btn btn-outline" style="padding:12px 18px; white-space:nowrap;">Filter</button>
      
      <!-- Luxury Icon Group for Expand/Collapse (exact from Toy Vault) -->
      <div style="display:flex; background:var(--glass); border:1px solid var(--border); border-radius:12px; padding:2px; align-items:center;">
        <button onclick="expandAllCategories()" class="btn-icon" title="Expand All">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
          </svg>
        </button>
        <div style="width:1px; background:var(--border); margin:4px 0;"></div>
        <button onclick="collapseAllCategories()" class="btn-icon" title="Collapse All">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 11l-5-5-5 5M17 18l-5-5-5 5"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="filter-chips" style="margin-bottom:16px;">
      <div class="chip active" onclick="toggleChip(this, '')" data-filter="all">All</div>
      <div class="chip" onclick="toggleChip(this, 'success-chip')" data-filter="loved">❤️ Loved</div>
      <div class="chip" onclick="toggleChip(this, 'danger-chip')" data-filter="hard">✕ Hard Limits</div>
      <div class="chip" onclick="toggleChip(this, 'purple-chip')" data-filter="scene">⚑ Scene</div>
    </div>

    <!-- CATEGORY PANELS (grouped & collapsible, like Toy Vault) -->
    <div id="catPanels"></div>

    <!-- SEARCH RESULTS -->
    <div id="searchResults" class="search-results-panel" style="display:none;">
      <div class="glass-card">
        <div style="font-size:12px; color:#888; margin-bottom:12px;">SEARCH RESULTS</div>
        <div id="searchResultsList"></div>
      </div>
    </div>

  </div>

  <!-- FLOATING ADD BUTTON (for custom activities) -->
  <button onclick="addCustomActivity()" class="fab">+</button>

  <!-- AGAIN SHEET (bottom sheet modal) -->
  <div id="againSheetOverlay" class="modal-back" onclick="closeAgainSheet(event)">
    <div class="modal-sheet" onclick="event.stopImmediatePropagation()">
      <div class="modal-handle"></div>
      <div class="modal-title">Do Again?</div>
      <div id="againSheetOptions" style="display:flex; flex-direction:column; gap:8px;"></div>
      <button onclick="closeAgainSheet()" class="btn btn-outline" style="width:100%; margin-top:20px;">Cancel</button>
    </div>
  </div>

  <script type="module">
    import { requireAuth, getMyProfile, getRelationship, getUserProfile } from './auth.js';
    import { doc, setDoc, deleteDoc, getDocs, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { db } from './firebase-config.js';

    // === DATA & STATE ===
    let myUid = null;
    let relId = null;
    let myRole = 'dom';
    let myName = 'You';
    let partnerName = 'Partner';
    let myData = {};
    let partnerData = {};
    let template = { base: {}, custom: [] };
    let customItems = [];
    let activeFilters = new Set();
    let activeSearch = '';
    let currentTab = 'all';
    let currentViewMode = 'both';
    let saveTimeout = null;

    const SEG_NO = "No and I don't want to";

    // === FIREBASE PATHS (original structure: relationships/{relId}/checklist) ===
    function checklistCol(id) {
      return collection(db, 'relationships', id, 'checklist');
    }
    function checklistCustomCol(id) {
      return collection(db, 'relationships', id, 'checklistCustom');
    }
    function checklistTemplateCol(id) {
      return collection(db, 'relationships', id, 'checklistTemplate');
    }

    async function init() {
      try {
        const user = await requireAuth();
        myUid = user.uid;

        const profile = await getMyProfile();
        myRole = profile?.role || 'dom';
        myName = profile?.displayName || 'You';

        const rel = await getRelationship();
        relId = rel?.id || myUid;

        if (rel) {
          const partnerUid = rel.domId === myUid ? rel.subId : rel.domId;
          const partnerProfile = await getUserProfile(partnerUid);
          partnerName = partnerProfile?.displayName || 'Partner';
        }

        // Load template from Firestore, or fall back to full original list
        const templateSnap = await getDocs(checklistTemplateCol(relId));
        
        if (!templateSnap.empty) {
          template.base = {};
          templateSnap.docs.forEach(d => {
            const cat = d.data().category;
            if (!template.base[cat]) template.base[cat] = [];
            template.base[cat].push(d.data());
          });
        } else {
          // Full original template — all items & categories from original-checklist-data.json
          template.base = {

      <div class="response-col mine ${myRole}-me">
        <div class="col-title">${myName} (you)</div>
        <div class="field-row">
          <div class="field-label">My role</div>
          ${switchRow(key + '.sw', mySw)}
        </div>
        <div class="field-row">
          <div class="field-label">Tried it?</div>
          ${segControl(key + '.t', myT)}
        </div>
        <div class="field-row">
          <div class="field-label">Rating</div>
          ${ratingIcons(key + '.r', myR)}
        </div>
        <div class="field-row">
          <div class="field-label">Do again?</div>
          ${smartBadgeHtml(key + '.a', myA)}
        </div>
        <div class="field-row">
          <div class="field-label">💬 Note to partner</div>
          <textarea class="form-textarea" rows="2" data-sk="${key}.ns" oninput="schedSave()" style="font-size:12px; padding:8px;">${myNs}</textarea>
        </div>
      </div>
      <div class="response-col theirs ${pPfx}-partner">
        <div class="col-title">${partnerName}</div>
        <div class="field-row">
          <div class="field-label">Their role</div>
          <div class="partner-val ${!v(pSw) ? 'empty' : ''}">${v(pSw) || '—'}</div>
        </div>
        <div class="field-row">
          <div class="field-label">Tried it?</div>
          <div class="partner-val ${!v(pT) ? 'empty' : ''}">${v(pT) || '—'}</div>
        </div>
        <div class="field-row">
          <div class="field-label">Rating</div>
          <div class="partner-val ${!v(pR) ? 'empty' : ''}">${v(pR) || '—'}</div>
        </div>
        <div class="field-row">
          <div class="field-label">Do again?</div>
          <div class="partner-val ${!v(pA) ? 'empty' : ''}">${v(pA) || '—'}</div>
        </div>
        ${v(pNs) ? `<div class="field-row"><div class="field-label">💬 Their note</div><div class="partner-note">${pNs}</div></div>` : ''}
      </div>
    </div>
  </div>
</div>`;
    }

    // Category collapse state (like Toy Vault)
    let collapsedCategories = {};

    function buildCatPanel(cat, items) {
      const div = document.createElement('div');
      div.className = 'glass-card';
      div.style.marginBottom = '20px';
      div.style.padding = '8px 0';
      
      const count = items.length;
      
      div.innerHTML = `
        <div onclick="toggleCategory('${cat}')" style="display:flex; align-items:center; justify-content:space-between; padding: 12px 20px; cursor:pointer;">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-family:'Playfair Display',serif; font-size:18px; font-weight:600; color:var(--gold);">${cat}</span>
            <span style="background:rgba(212,175,55,0.2); color:#ddd; font-size:12px; padding:4px 11px; border-radius:9999px; font-weight:600;">${count}</span>
          </div>
          <span id="chevron-${cat}" style="color:#666; font-size:18px; transition:transform .3s;">▾</span>
        </div>
        <div id="cat-rows-${cat}" style="padding: 0 12px;">
          ${items.map(i => buildCard(cat, i)).join('')}
        </div>
      `;
      
      document.getElementById('catPanels').appendChild(div);
    }

    function renderCustomItems() {
      const existing = document.getElementById('panel-custom');
      if (existing) existing.remove();

      if (customItems.length === 0) return;

      const div = document.createElement('div');
      div.className = 'glass-card';
      div.style.marginBottom = '20px';
      div.style.padding = '8px 0';
      
      div.innerHTML = `
        <div onclick="toggleCategory('Custom')" style="display:flex; align-items:center; justify-content:space-between; padding: 12px 20px; cursor:pointer;">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-family:'Playfair Display',serif; font-size:18px; font-weight:600; color:var(--gold);">Custom</span>
            <span style="background:rgba(212,175,55,0.2); color:#ddd; font-size:12px; padding:4px 11px; border-radius:9999px; font-weight:600;">${customItems.length}</span>
          </div>
          <span id="chevron-Custom" style="color:#666; font-size:18px; transition:transform .3s;">▾</span>
        </div>
        <div id="cat-rows-Custom" style="padding: 0 12px;">
          ${customItems.map(item => buildCard('Custom', item, true)).join('')}
        </div>
      `;
      
      document.getElementById('catPanels').appendChild(div);
    }

    // === COLLAPSIBLE CATEGORY FUNCTIONS (exact from Toy Vault) ===
    window.toggleCategory = function(cat) {
      const rows = document.getElementById('cat-rows-' + cat);
      const chevron = document.getElementById('chevron-' + cat);
      
      if (!rows) return;
      
      collapsedCategories[cat] = !collapsedCategories[cat];
      
      if (collapsedCategories[cat]) {
        rows.style.display = 'none';
        chevron.style.transform = 'rotate(-90deg)';
      } else {
        rows.style.display = 'block';
        chevron.style.transform = 'rotate(0deg)';
      }
    };

    window.expandAllCategories = function() {
      const cats = [...Object.keys(template.base), 'Custom'];
      cats.forEach(cat => {
        collapsedCategories[cat] = false;
        const rows = document.getElementById('cat-rows-' + cat);
        const chevron = document.getElementById('chevron-' + cat);
        if (rows) rows.style.display = 'block';
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      });
    };

    window.collapseAllCategories = function() {
      const cats = [...Object.keys(template.base), 'Custom'];
      cats.forEach(cat => {
        collapsedCategories[cat] = true;
        const rows = document.getElementById('cat-rows-' + cat);
        const chevron = document.getElementById('chevron-' + cat);
        if (rows) rows.style.display = 'none';
        if (chevron) chevron.style.transform = 'rotate(-90deg)';
      });
    };

    // === HELPER FUNCTIONS (kept from original) ===
    function ik(cat, act) { return cat.toLowerCase().replace(/\s+/g,'_') + '|' + act.toLowerCase().replace(/\s+/g,'_'); }
    function v(val) { return val && val !== '' ? val : ''; }
    function bv(item, role, field) {
      if (!item[role]) return '';
      const map = { T: 't', R: 'r', A: 'a', S: 'sw' };
      return item[role][map[field]] || '';
    }

    function getStatusIcon(t, r, a) {
      if (a.includes('Hard Limit')) return { i: '✕', c: 'danger' };
      if (a.includes('Fetish')) return { i: '⚡', c: 'gold' };
      if (r.includes('Loved')) return { i: '❤️', c: 'success' };
      if (r.includes('Liked')) return { i: '👍', c: 'blue' };
      if (t === 'Yes') return { i: '✓', c: '' };
      return { i: '—', c: '' };
    }

    function getAccent(myA, pA, myR, pR, isCustom, flagged) {
      if (isCustom) return 'custom-item';
      if (flagged) return 'scene-flagged';
      if (myA.includes('Hard Limit') || pA.includes('Hard Limit')) return 'hard-limit';
      if (myA.includes('Fetish') && pA.includes('Fetish')) return 'fetish-flag';
      if (myR.includes('Loved') && pR.includes('Loved')) return 'loved-both';
      return '';
    }

    function updateAllCardAccents() {
      const pPfx = myRole === 'dom' ? 'sub' : 'dom';
      document.querySelectorAll('.activity-card[data-cat]').forEach(card => {
        const cat = card.dataset.cat, act = card.dataset.act, key = ik(cat, act);
        const myA = myData[key + '.a'] ?? '', pA = partnerData[key + '.a'] ?? '';
        const myR = myData[key + '.r'] ?? '', pR = partnerData[key + '.r'] ?? '';
        card.classList.remove('hard-limit', 'fetish-flag', 'loved-both', 'scene-flagged', 'custom-item');
        const accent = getAccent(myA, pA, myR, pR, card.classList.contains('custom-item'), myData[key + '.flagged']);
        if (accent) card.classList.add(accent);
      });
    }

    const SWITCH_OPTS = ['Giving', 'Receiving', 'Both', 'Wearing', 'Others Wearing', 'Not Applicable'];
    function switchRow(sk, val) {
      return `<div class="switch-row">${SWITCH_OPTS.map(o => 
        `<div class="switch-opt${val === o ? ' active-sw' : ''}" onclick="setSwitchOpt(this,'${sk}','${o}')">${o}</div>`
      ).join('')}</div>`;
    }

    function segControl(sk, val) {
      const isYes = val === 'Yes', isWant = val === 'No but I want to', isNo = val === SEG_NO;
      return `<div class="seg-control">
        <button class="seg-btn${isYes ? ' active-yes' : ''}" onclick="setSeg(this,'${sk}','Yes')">Yes</button>
        <button class="seg-btn${isWant ? ' active-want' : ''}" onclick="setSeg(this,'${sk}','No but I want to')">Want to</button>
        <button class="seg-btn${isNo ? ' active-no' : ''}" onclick="setSeg(this,'${sk}',SEG_NO)">No</button>
      </div>`;
    }

    const RATING_OPTS = [
      { val: 'Loved it', icon: '❤️', lbl: 'Loved', cls: 'active-loved' },
      { val: 'Liked it', icon: '👍', lbl: 'Liked', cls: 'active-liked' },
      { val: 'Take it or leave it', icon: '😐', lbl: 'Neutral', cls: 'active-meh' },
      { val: 'Not Applicable', icon: '—', lbl: 'N/A', cls: 'active-na' },
    ];
    function ratingIcons(sk, val) {
      return `<div class="rating-row">${RATING_OPTS.map(o => 
        `<div class="rating-opt${val === o.val ? ' ' + o.cls : ''}" onclick="setRating(this,'${sk}','${o.val}')"><span class="r-icon">${o.icon}</span><span class="r-lbl">${o.lbl}</span></div>`
      ).join('')}</div>`;
    }

    const AGAIN_OPTS = [
      { val: 'Fetish/Need', cls: 'sb-fetish', label: '⚡ Fetish/Need' },
      { val: 'Yes', cls: 'sb-yes', label: '✓ Yes' },
      { val: 'Maybe', cls: 'sb-maybe', label: '~ Maybe' },
      { val: 'Unlikely. Soft Limit', cls: 'sb-soft', label: '⚠ Soft Limit' },
      { val: 'Never. Hard Limit', cls: 'sb-hard', label: '✕ Hard Limit' },
      { val: 'Not Applicable', cls: 'sb-na', label: '— N/A' },
    ];

    function smartBadgeHtml(sk, val) {
      const opt = AGAIN_OPTS.find(o => o.val === val);
      return `<div class="smart-badge" onclick="openAgainSheet('${sk}')" data-sk-again="${sk}"><span class="sb-label">${opt ? opt.label : 'Tap to set…'}</span><span class="sb-arrow">▾</span></div>`;
    }

    let againSheetKey = null;
    window.openAgainSheet = function(sk) {
      againSheetKey = sk;
      const current = myData[sk] ?? '';
      const SHEET_OPTS = [
        { val: 'Fetish/Need', cls: 'ao-fetish', label: '⚡ Fetish/Need' },
        { val: 'Yes', cls: 'ao-yes', label: '✓ Yes' },
        { val: 'Maybe', cls: 'ao-maybe', label: '~ Maybe' },
        { val: 'Unlikely. Soft Limit', cls: 'ao-soft', label: '⚠ Soft Limit' },
        { val: 'Never. Hard Limit', cls: 'ao-hard', label: '✕ Hard Limit' },
        { val: 'Not Applicable', cls: 'ao-na', label: '— N/A' },
        { val: '', cls: 'ao-clear', label: 'Clear' },
      ];
      document.getElementById('againSheetOptions').innerHTML = SHEET_OPTS.map(o => 
        `<div class="smart-badge" style="margin:4px 0;" onclick="pickAgain('${o.val}')"><span class="sb-label">${o.label}</span></div>`
      ).join('');
      document.getElementById('againSheetOverlay').classList.add('open');
    };

    window.pickAgain = function(val) {
      myData[againSheetKey] = val; schedSave();
      const badge = document.querySelector(`[data-sk-again="${againSheetKey}"]`);
      const opt = AGAIN_OPTS.find(o => o.val === val);
      if (badge) {
        badge.querySelector('.sb-label').textContent = opt ? opt.label : 'Tap to set…';
      }
      onFCKey(againSheetKey);
      document.getElementById('againSheetOverlay').classList.remove('open');
    };

    window.closeAgainSheet = function(e) {
      if (!e || e.target.id === 'againSheetOverlay') {
        document.getElementById('againSheetOverlay').classList.remove('open');
      }
    };

    window.setSwitchOpt = function(el, sk, val) {
      const isActive = el.classList.contains('active-sw');
      myData[sk] = isActive ? '' : val; schedSave();
      el.closest('.switch-row').querySelectorAll('.switch-opt').forEach(o => o.classList.toggle('active-sw', o === el && !isActive));
    };

    window.setSeg = function(btn, sk, val) {
      myData[sk] = val; schedSave();
      btn.closest('.seg-control').querySelectorAll('.seg-btn').forEach(b => b.className = 'seg-btn');
      btn.className = 'seg-btn ' + (val === 'Yes' ? 'active-yes' : val === SEG_NO ? 'active-no' : 'active-want');
      onFCKey(sk);
    };

    window.setRating = function(el, sk, val) {
      myData[sk] = val; schedSave();
      el.closest('.rating-row').querySelectorAll('.rating-opt').forEach(o => o.classList.remove('active-loved', 'active-liked', 'active-meh', 'active-na'));
      el.classList.add(RATING_OPTS.find(o => o.val === val).cls);
      onFCKey(sk);
    };

    function onFCKey(sk) {
      const k = sk.replace(/\.[a-z]{1,3}$/, '');
      const sid = k.replace(/[^a-z0-9]/gi, '_');
      const card = document.getElementById('c_' + sid);
      if (card) {
        const cat = card.dataset.cat, act = card.dataset.act, key = ik(cat, act);
        const myA = myData[key + '.a'] ?? '', pA = partnerData[key + '.a'] ?? '';
        const myR = myData[key + '.r'] ?? '', pR = partnerData[key + '.r'] ?? '';
        card.classList.remove('hard-limit', 'fetish-flag', 'loved-both', 'scene-flagged');
        const accent = getAccent(myA, pA, myR, pR, card.classList.contains('custom-item'), myData[key + '.flagged']);
        if (accent) card.classList.add(accent);
      }
      buildStats();
      applyFilters();
    }

    window.toggleFlag = function(key) {
      myData[key + '.flagged'] = !myData[key + '.flagged']; schedSave();
      const sid = key.replace(/[^a-z0-9]/gi, '_');
      const card = document.getElementById('c_' + sid);
      if (card) {
        card.querySelector('.flag-btn').classList.toggle('flagged', myData[key + '.flagged']);
        onFCKey(key + '.f');
      }
    };

    window.toggleCard = function(h) {
      h.closest('.activity-card').classList.toggle('open');
    };

    window.setViewMode = function(mode) {
      currentViewMode = mode;
      document.body.classList.remove('view-me', 'view-partner', 'view-both');
      document.body.classList.add('view-' + mode);
      document.querySelectorAll('.view-opt').forEach(opt => opt.classList.toggle('active', opt.dataset.view === mode));
      localStorage.setItem('checklist_view_mode', mode);
      // Re-apply filters so card display states stay correct
      applyFilters();
    };

    // === STATS ===
    function buildStats() {
      let total = 0, loved = 0, hard = 0, custom = customItems.length;

      Object.keys(template.base).forEach(cat => {
        template.base[cat].forEach(item => {
          total++;
          const key = ik(cat, item.a);
          const myA = myData[key + '.a'] || '';
          const myR = myData[key + '.r'] || '';
          if (myA.includes('Fetish') || myR.includes('Loved')) loved++;
          if (myA.includes('Hard Limit')) hard++;
        });
      });

      document.getElementById('stat-total').textContent = total + custom;
      document.getElementById('stat-loved').textContent = loved;
      document.getElementById('stat-hard').textContent = hard;
      document.getElementById('stat-custom').textContent = custom;
    }

    // === FILTERS ===
    window.onSearch = function(val) {
      activeSearch = val.toLowerCase();
      applyFilters();
    };

    window.clearSearch = function() {
      document.getElementById('searchInput').value = '';
      activeSearch = '';
      applyFilters();
    };

    window.toggleChip = function(el, cls) {
      const f = el.dataset.filter;
      if (activeFilters.has(f)) {
        activeFilters.delete(f);
        el.classList.remove('active', cls);
      } else {
        activeFilters.add(f);
        el.classList.add('active', cls);
      }
      applyFilters();
    };

    function applyFilters() {
      const searchTerm = activeSearch;
      const hasFilters = activeFilters.size > 0 && !activeFilters.has('all');

      document.querySelectorAll('.activity-card[data-cat]').forEach(card => {
        const act = card.dataset.act.toLowerCase();
        const cat = card.dataset.cat;
        const key = ik(cat, card.dataset.act);
        const myA = myData[key + '.a'] || '';
        const myR = myData[key + '.r'] || '';
        const pA = partnerData[key + '.a'] || '';
        const pR = partnerData[key + '.r'] || '';

        let visible = true;

        if (searchTerm && !act.includes(searchTerm)) visible = false;

        if (hasFilters) {
          let match = false;
          // In partner-only mode, filter against partner data; otherwise use my data
          const filterA = currentViewMode === 'partner' ? pA : myA;
          const filterR = currentViewMode === 'partner' ? pR : myR;
          if (activeFilters.has('loved') && (filterA.includes('Fetish') || filterR.includes('Loved'))) match = true;
          if (activeFilters.has('hard') && filterA.includes('Hard Limit')) match = true;
          if (activeFilters.has('scene') && myData[key + '.flagged']) match = true;
          if (!match && !activeFilters.has('all')) visible = false;
        }

        // Use empty string to unset inline style so CSS view-mode rules still apply
        card.style.display = visible ? '' : 'none';
      });
    }

    // === CUSTOM ACTIVITIES ===
    window.addCustomActivity = function() {
      const name = prompt("Enter custom activity name:");
      if (!name || !name.trim()) return;

      const cat = prompt("Category (e.g. Sensation Play, Impact Play, etc.):", "Custom");
      if (!cat) return;

      const id = 'custom_' + Date.now();
      const newItem = {
        id,
        activity: name.trim(),
        category: cat.trim(),
        owner: myRole,
        added: Date.now()
      };

      customItems.push(newItem);
      renderCustomItems();
      buildStats();

      // Save to Firestore (original path)
      if (relId) {
        setDoc(doc(checklistCustomCol(relId), id), newItem);
      }

      showToast("Custom activity added", "success");
    };

    window.delCustom = async function(id) {
      if (!confirm("Delete this custom activity?")) return;
      customItems = customItems.filter(i => i.id !== id);
      renderCustomItems();
      buildStats();

      if (relId) {
        await deleteDoc(doc(checklistCustomCol(relId), id));
      }
    };

    // === SAVE ===
    function schedSave() {
      if (saveTimeout) clearTimeout(saveTimeout);
      setSaveStatus('Saving…', 'saving');
      
      saveTimeout = setTimeout(async () => {
        try {
          const updates = [];
          Object.keys(myData).forEach(sk => {
            if (sk.endsWith('.ts')) return;
            updates.push(setDoc(doc(checklistCol(relId), sk), { v: myData[sk], ts: Date.now() }));
          });
          await Promise.all(updates);
          setSaveStatus('Saved', 'saved');
          setTimeout(() => setSaveStatus('', '—'), 2000);
        } catch (e) {
          setSaveStatus('Error', 'error');
        }
      }, 800);
    }

    function setSaveStatus(text, cls) {
      const el = document.getElementById('saveStatus');
      if (!el) return;
      el.textContent = text;
      el.className = 'save-status ' + cls;
    }

    function showToast(msg, type = 'success') {
      const toast = document.createElement('div');
      toast.style.cssText = `position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:${type === 'success' ? '#27ae60' : '#c0392b'}; color:white; padding:12px 24px; border-radius:30px; font-size:13px; font-weight:700; z-index:9999; box-shadow:0 8px 25px rgba(0,0,0,0.3);`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2200);
    }

    // === INIT ===
    init();
  </script>

  <script src="nav.js"></script>
</body>
</html>
