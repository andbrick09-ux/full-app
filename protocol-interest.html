function sid(cat, item){ return cat + "||" + item; }

let marks = {};
let mode = "all";
let canEdit = true;
let saveTimer = null;
let subjectName = "you";

function toast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function allItems(){
  const out = [];
  DATA.forEach(s => s.items.forEach(item => out.push({cat:s.cat, item})));
  return out;
}

function stats(){
  const total = allItems().length;
  let like=0,maybe=0,no=0;
  Object.values(marks).forEach(v => {
    if(v==="like") like++; else if(v==="maybe") maybe++; else if(v==="no") no++;
  });
  nTotal.textContent = total;
  nLike.textContent = like;
  nMaybe.textContent = maybe;
  nNo.textContent = no;
}

function visible(id){
  if(mode==="all") return true;
  if(mode==="unset") return !marks[id];
  return marks[id]===mode;
}

function render(){
  const root = document.getElementById("piSections");
  root.innerHTML = "";
  DATA.forEach(section => {
    const items = section.items.filter(item => visible(sid(section.cat, item)));
    if(!items.length) return;
    const card = document.createElement("div");
    card.className = "glass-card";
    card.style.marginBottom = "16px";
    card.innerHTML = `<h2 style="font-family:'Playfair Display',serif;color:#d4af77;margin:0 0 4px">${section.cat}</h2>
      <p style="color:var(--muted,#b7b0a3);font-size:13px;margin:0 0 8px">${section.hint}</p>`;
    items.forEach(item => {
      const id = sid(section.cat, item);
      const row = document.createElement("div");
      row.className = "pi-item" + (canEdit ? "" : " pi-readonly");
      row.innerHTML = `<div class="pi-name">${item}</div>
        <div class="pi-picks">
          <button type="button" class="pi-pick${marks[id]==="like"?" on":""}" data-v="like">Like</button>
          <button type="button" class="pi-pick${marks[id]==="maybe"?" on":""}" data-v="maybe">Maybe</button>
          <button type="button" class="pi-pick${marks[id]==="no"?" on":""}" data-v="no">No</button>
        </div>`;
      row.querySelectorAll(".pi-pick").forEach(btn => {
        btn.onclick = () => {
          if(!canEdit) return;
          const v = btn.dataset.v;
          if(marks[id]===v) delete marks[id]; else marks[id]=v;
          render();
          queueSave();
        };
      });
      card.appendChild(row);
    });
    root.appendChild(card);
  });
  stats();
}

function buildSummary(){
  const buckets = {like:[], maybe:[], no:[]};
  allItems().forEach(({cat,item}) => {
    const v = marks[sid(cat,item)];
    if(v) buckets[v].push("• " + item);
  });
  const block = (title, arr) => arr.length ? title+"\n"+arr.join("\n")+"\n\n" : "";
  return "Protocol interest — " + subjectName + "\n\n" +
    block("LIKE", buckets.like) +
    block("MAYBE", buckets.maybe) +
    block("NO", buckets.no) +
    "(Unmarked items were left blank.)";
}

function queueSave(){
  document.getElementById("piSave").textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 400);
}

async function saveNow(){
  try{
    await setDoc(dataRef("protocolInterest"), {
      marks,
      updatedAt: serverTimestamp()
    }, { merge: true });
    document.getElementById("piSave").textContent = "Saved to her file. Sir can see this.";
  }catch(e){
    console.error(e);
    document.getElementById("piSave").textContent = "Save failed. Check connection.";
    toast("Could not save");
  }
}

document.querySelectorAll("[data-filter]").forEach(btn => {
  btn.onclick = () => {
    mode = btn.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b => b.classList.toggle("on", b===btn));
    document.getElementById("summaryCard").style.display = "none";
    render();
  };
});
document.getElementById("btnSummary").onclick = () => {
  const card = document.getElementById("summaryCard");
  document.getElementById("piSummary").textContent = buildSummary();
  card.style.display = "block";
  card.scrollIntoView({behavior:"smooth"});
};

async function loadActiveSubMarks(){
  marks = {};
  try{
    const pref = await partnerDataRef("protocolInterest");
    const snap = await getDoc(pref);
    if(snap.exists()) marks = snap.data().marks || {};
    const pUid = await getPartnerUid();
    const p = pUid ? await getUserProfile(pUid) : null;
    subjectName = p?.displayName || "your sub";
    document.getElementById("piBanner").textContent =
      "Viewing " + subjectName + "’s answers. She marks these on her account.";
    document.getElementById("piSave").textContent = "Read-only for Sir.";
  }catch(e){
    subjectName = "your sub";
    document.getElementById("piBanner").textContent = "No paired sub, or her list has not been saved yet.";
    document.getElementById("piSave").textContent = "";
  }
  document.getElementById("summaryCard").style.display = "none";
  render();
}

async function renderRosterSwitcher(){
  const banner = document.getElementById("subSwitcherBanner");
  const select = document.getElementById("subSwitcher");
  const roster = await getDomRoster();
  const activePartnerUid = await getPartnerUid();

  if(!roster.length){
    banner.style.display = "none";
    return;
  }

  for(const r of roster){
    const p = await getUserProfile(r.subId);
    r.subName = p?.displayName || "Unknown sub";
  }

  select.innerHTML = roster.map(r => {
    const selected = r.subId === activePartnerUid ? "selected" : "";
    return `<option value="${r.id}" ${selected}>${r.subName}</option>`;
  }).join("");

  banner.style.display = roster.length ? "flex" : "none";

  select.onchange = async (e) => {
    select.disabled = true;
    toast("Switching active sub…");
    try{
      await switchActiveSub(e.target.value);
      await loadActiveSubMarks();
      toast("Now viewing " + subjectName);
    }catch(err){
      console.error(err);
      toast("Could not switch sub");
    }
    select.disabled = false;
  };
}

async function init(){
  await requireAuth();
  const profile = await getMyProfile();
  const isDom = profile?.role === "dom";

  if(isDom){
    canEdit = false;
    await renderRosterSwitcher();
    await loadActiveSubMarks();
  }else{
    canEdit = true;
    document.getElementById("subSwitcherBanner").style.display = "none";
    const snap = await getDoc(dataRef("protocolInterest"));
    if(snap.exists()) marks = snap.data().marks || {};
    subjectName = profile?.displayName || "you";
    document.getElementById("piBanner").textContent =
      "Mark what you like, might try, or do not want. Sir can see your answers.";
    document.getElementById("piSave").textContent = "Marks save automatically.";
    render();
  }
}
init();
</script>
