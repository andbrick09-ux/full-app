<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#051024"/>
<title>SPTI Profile · Dom Sub Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,1,0&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="nav.css"/>

<style>
  .shell {
    position:relative; z-index:1;
    max-width:480px; margin:0 auto;
    display:flex; flex-direction:column; min-height:100dvh;
  }
  .page-content {
    flex:1; overflow-y:auto; overflow-x:hidden;
    padding:24px 20px 100px; scrollbar-width:none;
  }
  .page-content::-webkit-scrollbar { display:none; }

  /* Redesign custom styles based on native classes */
  .title-section { margin-bottom: 24px; }
  .title-section h1 { 
    font-family: 'Playfair Display', serif; 
    color: var(--gold); 
    font-size: 24px; 
    margin-bottom: 12px; 
  }
  .title-section p { 
    font-size: 13px; 
    color: var(--cream-dim); 
    line-height: 1.6; 
    margin-bottom: 14px; 
  }
  
  .take-test-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--luxury-gradient); color: var(--deep-blue);
    font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700;
    text-align: center; display: block; text-decoration: none;
    margin-bottom: 32px; transition: transform 0.2s;
  }
  .take-test-btn:active { transform: scale(0.98); }

  .paste-section label {
    display: block; font-size: 13px; color: var(--cream); margin-bottom: 8px; font-family: 'Montserrat', sans-serif;
  }
  .results-textarea {
    width: 100%; height: 200px; background: rgba(2,8,20,0.6);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; color: var(--cream); font-family: 'Montserrat', sans-serif;
    font-size: 13px; resize: none; margin-bottom: 16px; outline: none;
    line-height: 1.5;
  }
  .results-textarea:focus { border-color: var(--gold); }
  .results-textarea::placeholder { color: var(--cream-mute); }

  .actions-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  
  .save-btn {
    padding: 12px 24px; border-radius: 30px; border: none; cursor: pointer;
    background: var(--luxury-gradient); color: var(--deep-blue);
    font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600;
    transition: transform 0.2s;
  }
  .save-btn:active { transform: scale(0.95); }

  .skip-btn {
    background: transparent; border: none; color: var(--cream-dim); cursor: pointer;
    font-family: 'Montserrat', sans-serif; font-size: 13px; text-decoration: underline;
  }

  .back-bottom-btn {
    display: block; width: 100%; padding: 14px; border-radius: 30px;
    background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: var(--cream-dim); text-align: center; text-decoration: none;
    font-family: 'Montserrat', sans-serif; font-size: 13px;
    transition: background 0.2s;
  }
  .back-bottom-btn:active { background: rgba(255,255,255,0.05); }

  /* ── Toast ── */
  .dsh-toast {
    position:fixed; bottom:calc(80px + var(--safe-b)); left:50%;
    transform:translateX(-50%) translateY(12px);
    background:#0d1120; border:1px solid var(--border);
    border-radius:24px; padding:10px 20px;
    font-size:11px; font-weight:600; color:var(--gold);
    letter-spacing:.5px; white-space:nowrap; z-index:999;
    opacity:0; pointer-events:none; transition:all .3s ease;
  }
  .dsh-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body data-nav="more">
<div class="shell">
  <!-- Content -->
  <div class="page-content">
    <div class="title-section">
      <h1>SPTI profile</h1>
      <p>Results are private — only you and the AI see them. They help tailor scene ideas, kink examples, and tone. Your partner only sees whether you've completed SPTI.</p>
      <p>You skipped SPTI earlier. Paste results when ready.</p>
    </div>

    <a href="https://spti-test.com" target="_blank" class="take-test-btn">Take the test at spti-test.com</a>

    <div class="paste-section">
      <label>Paste results</label>
      <textarea id="sptiResults" class="results-textarea" placeholder="Paste your SPTI results from spti-test.com..."></textarea>
    </div>

    <div class="actions-row">
      <button class="save-btn" onclick="saveResults()">Save results</button>
      <button class="skip-btn" onclick="clearOrSkip()">Clear / skip for now</button>
    </div>

    <a href="more.html" class="back-bottom-btn">Back to knowledge</a>
  </div>
</div>

<div class="dsh-toast" id="toast"></div>

<script src="nav.js"></script>
<script>
  // Load existing results on page load
  document.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("spti_profile_results");
    if (saved) {
      document.getElementById("sptiResults").value = saved;
    }
  });

  function showToast(msg, callback) {
    var t = document.getElementById('toast'); 
    if(!t) return;
    t.textContent = msg; 
    t.classList.add('show');
    setTimeout(function() { 
        t.classList.remove('show'); 
        if(callback) setTimeout(callback, 300);
    }, 2000);
  }

  function saveResults() {
    const val = document.getElementById("sptiResults").value;
    localStorage.setItem("spti_profile_results", val);
    showToast("Results saved securely!", function() {
        window.location.href = "more.html";
    });
  }

  function clearOrSkip() {
    document.getElementById("sptiResults").value = "";
    localStorage.removeItem("spti_profile_results");
    window.location.href = "more.html";
  }
</script>
</body>
</html>
